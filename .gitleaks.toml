title = "Gitleaks Configuration for defcon.run"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"

# Allow self-signed certificate keys used for local HTTPS development
# These are not real secrets - they're for local dev only
paths = [
  '''.*selfsigned\.key$''',
  '''.*selfsigned\.pem$''',
]

# Public map tile provider API keys in gpx-studio
# These are intentionally public keys for map services (Thunderforest, MapTiler, etc.)
# See: gpx-studio/website/src/lib/assets/layers.ts
regexes = [
  '''30cb768c-c968-493c-ae24-2b0b974ebd29''',
  '''d01fbtg0ar23gctac5m0jgyy2ds''',
  '''piCT8WysfuC3xLSUW7sGLfrAAJoYDvQz''',
  '''AIzaSyA2ZadQob_hXiT2VaYIkAyafPvz_4ZMssk''',
]
