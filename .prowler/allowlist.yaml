# Prowler Allowlist for DEF CON 34 Infrastructure
# Skip checks that don't apply to our use case or are intentionally accepted risks
#
# Format: Each entry specifies a check to skip with justification
# See: https://docs.prowler.com/projects/prowler-open-source/en/latest/tutorials/allowlist/

Allowlist:
  Accounts:
    # Apply to all accounts (uses "*" wildcard)
    "*":
      Checks:
        # ===========================================
        # Root Account & MFA - Managed separately
        # ===========================================
        # Root account is managed at the organization level, not per-account
        - "iam_root_hardware_mfa_enabled"
        - "iam_root_mfa_enabled"
        - "iam_no_root_access_key"
        - "iam_avoid_root_usage"

        # ===========================================
        # MFA for IAM Users - We use OIDC federation
        # ===========================================
        # No IAM users with console access - all access via OIDC/SSO
        - "iam_user_mfa_enabled_console_access"
        - "iam_user_hardware_mfa_enabled"

        # ===========================================
        # Password Policy - No console users
        # ===========================================
        # We don't have IAM users with passwords, only programmatic access
        - "iam_password_policy_uppercase"
        - "iam_password_policy_lowercase"
        - "iam_password_policy_number"
        - "iam_password_policy_symbol"
        - "iam_password_policy_minimum_length_14"
        - "iam_password_policy_expires_passwords_within_90_days_or_less"
        - "iam_password_policy_reuse_24"

        # ===========================================
        # Support Role - Not using AWS Support
        # ===========================================
        - "iam_support_role_created"

        # ===========================================
        # AWS-Managed Roles with AdministratorAccess
        # ===========================================
        # OrganizationAccountAccessRole is auto-created by AWS Organizations
        # and is required for management account to administer member accounts.
        - "iam_role_administratoraccess_policy:arn:aws:iam::*:role/OrganizationAccountAccessRole"
        # AWSReservedSSO_AdministratorAccess is created by AWS IAM Identity Center (SSO)
        # for administrator access via SSO. The suffix is auto-generated by AWS.
        - "iam_role_administratoraccess_policy:arn:aws:iam::*:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_AdministratorAccess_*"

        # ===========================================
        # CloudTrail - May not be enabled yet
        # ===========================================
        # Uncomment these if CloudTrail is not set up
        # - "cloudtrail_multi_region_enabled"
        # - "cloudtrail_s3_dataevents_read_enabled"
        # - "cloudtrail_s3_dataevents_write_enabled"
        # - "cloudtrail_cloudwatch_logging_enabled"

        # ===========================================
        # Config - AWS Config may not be enabled
        # ===========================================
        # Uncomment if AWS Config is not set up
        # - "config_recorder_all_regions_enabled"

        # ===========================================
        # GuardDuty - May not be enabled
        # ===========================================
        # Uncomment if GuardDuty is not enabled
        # - "guardduty_is_enabled"

        # ===========================================
        # SecurityHub - May not be enabled
        # ===========================================
        # Uncomment if SecurityHub is not enabled
        # - "securityhub_enabled"

      # ===========================================
      # ALB Access Logs - Required cross-account access
      # ===========================================
      # ALB access logging requires AWS's regional ELB accounts to write logs.
      # These are official AWS-managed accounts, not arbitrary cross-account access.
      # See: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/enable-access-logging.html
      Resources:
        - "arn:aws:s3:::logs-alb-*":
            Checks:
              - "s3_bucket_cross_account_access"
            Justification: "ALB access logs require AWS ELB regional accounts (797873946194, 127311923021, 985666609251) to write logs - this is AWS-required architecture"
