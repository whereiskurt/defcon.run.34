# Prowler Mutelist for DEF CON 34 Infrastructure
# Skip checks that don't apply to our use case or are intentionally accepted risks
# See: https://docs.prowler.com/projects/prowler-open-source/en/latest/tutorials/mutelist/

Mutelist:
  Accounts:
    "*":
      Checks:
        # Root Account & MFA - Managed at organization level
        iam_root_hardware_mfa_enabled:
          Regions:
            - "*"
          Resources:
            - "*"
        iam_root_mfa_enabled:
          Regions:
            - "*"
          Resources:
            - "*"
        iam_no_root_access_key:
          Regions:
            - "*"
          Resources:
            - "*"
        iam_avoid_root_usage:
          Regions:
            - "*"
          Resources:
            - "*"

        # MFA for IAM Users - We use OIDC federation, no console users
        iam_user_mfa_enabled_console_access:
          Regions:
            - "*"
          Resources:
            - "*"
        iam_user_hardware_mfa_enabled:
          Regions:
            - "*"
          Resources:
            - "*"

        # Password Policy - No IAM users with passwords
        iam_password_policy_uppercase:
          Regions:
            - "*"
          Resources:
            - "*"
        iam_password_policy_lowercase:
          Regions:
            - "*"
          Resources:
            - "*"
        iam_password_policy_number:
          Regions:
            - "*"
          Resources:
            - "*"
        iam_password_policy_symbol:
          Regions:
            - "*"
          Resources:
            - "*"
        iam_password_policy_minimum_length_14:
          Regions:
            - "*"
          Resources:
            - "*"
        iam_password_policy_expires_passwords_within_90_days_or_less:
          Regions:
            - "*"
          Resources:
            - "*"
        iam_password_policy_reuse_24:
          Regions:
            - "*"
          Resources:
            - "*"

        # Support Role - Not using AWS Support
        iam_support_role_created:
          Regions:
            - "*"
          Resources:
            - "*"

        # AWS-Managed Roles with AdministratorAccess - Required by AWS
        iam_role_administratoraccess_policy:
          Regions:
            - "*"
          Resources:
            - "*OrganizationAccountAccessRole*"
            - "*AWSReservedSSO_AdministratorAccess_*"

        # AWS-Managed Policy - This is an AWS baseline policy
        iam_aws_attached_policy_no_administrative_privileges:
          Regions:
            - "*"
          Resources:
            - "arn:aws:iam::aws:policy/AdministratorAccess"

        # ECS Read-Only Root Filesystem - Fargate doesn't support tmpfs
        ecs_task_definitions_containers_readonly_access:
          Regions:
            - "*"
          Resources:
            - "*"

        # S3 Account Level Public Access - May be intentionally configured
        s3_account_level_public_access_blocks:
          Regions:
            - "*"
          Resources:
            - "*"

        # ALB Access Logs - AWS ELB regional accounts need cross-account access
        s3_bucket_cross_account_access:
          Regions:
            - "*"
          Resources:
            - "*logs-alb-*"
            - "*www.defcon.run*"

        # KMS Key Rotation - Multi-region keys have different rotation requirements
        kms_cmk_rotation_enabled:
          Regions:
            - "*"
          Resources:
            - "*"

        # IAM Confused Deputy - Some roles are externally managed
        iam_role_cross_service_confused_deputy_prevention:
          Regions:
            - "*"
          Resources:
            - "*ssm-instance-policy*"
