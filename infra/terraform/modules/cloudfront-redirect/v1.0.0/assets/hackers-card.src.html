<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family: "Arial Black", Impact, "Helvetica Neue", sans-serif;
    background:#04060d;
    position:relative;
  }
  /* neon glows */
  .glow-a { position:absolute; inset:0;
    background:
      radial-gradient(60% 70% at 18% 8%,  rgba(70,190,255,.38), transparent 60%),
      radial-gradient(70% 80% at 92% 100%, rgba(255,40,170,.42), transparent 60%),
      radial-gradient(50% 60% at 55% 45%, rgba(30,90,180,.30), transparent 65%);
  }
  /* CRT monitor wall */
  .wall { position:absolute; inset:0; display:grid;
    grid-template-columns:repeat(6,1fr); grid-template-rows:repeat(4,1fr);
    gap:10px; padding:14px; opacity:.5; }
  .mon { border:2px solid rgba(90,150,220,.28); border-radius:4px;
    background:linear-gradient(180deg, rgba(10,30,60,.55), rgba(4,8,18,.7));
    overflow:hidden; position:relative; box-shadow:inset 0 0 30px rgba(0,0,0,.7); }
  .mon pre { color:rgba(90,255,150,.5); font:9px/1.35 "Courier New",monospace;
    padding:6px; white-space:pre-wrap; word-break:break-all; text-shadow:0 0 6px rgba(60,255,130,.5); }
  /* scanlines */
  .scan { position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply; }
  .vig { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 120% at 50% 45%, transparent 55%, rgba(0,0,0,.75)); }

  .stage { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; }

  .studio { position:absolute; top:34px; left:50%; transform:translateX(-50%);
    letter-spacing:.42em; font-size:15px; font-weight:800; color:#cfe6ff;
    opacity:.82; text-shadow:0 0 12px rgba(90,190,255,.7); }

  .title { font-size:196px; line-height:.86; letter-spacing:.02em;
    color:#7fe1ff;
    text-shadow:
      0 0 2px #eafcff,
      0 0 22px rgba(120,225,255,.95),
      0 0 60px rgba(90,190,255,.8),
      4px 4px 0 #b8860b, 5px 5px 0 #7a5a08,
      0 0 90px rgba(255,60,170,.35);
    transform:skewX(-6deg); }
  .title span { display:inline-block; }
  .title .up { transform:translateY(-12px); }
  .title .dn { transform:translateY(12px); }

  .tag { margin-top:20px; letter-spacing:.52em; font-size:26px; font-weight:800;
    color:#ffd0ec; text-shadow:0 0 16px rgba(255,60,170,.85); }

  .bar { position:absolute; bottom:30px; left:0; right:0; display:flex;
    align-items:center; justify-content:center; gap:26px;
    font-family:"Helvetica Neue",Arial,sans-serif; }
  .chip { font-size:19px; font-weight:800; letter-spacing:.06em; color:#dfeeff; }
  .chip b { color:#7fe1ff; }
  .star { color:#ffcf3f; text-shadow:0 0 10px rgba(255,190,50,.8); }
  .dot { color:#4a6a95; }
  .watch { font-family:"Arial Black",sans-serif; font-size:19px; letter-spacing:.14em;
    color:#04060d; background:#7fe1ff; padding:8px 18px; border-radius:999px;
    box-shadow:0 0 26px rgba(120,225,255,.9); }
  .url { position:absolute; bottom:32px; right:36px;
    font-family:"Courier New",monospace; font-size:16px; letter-spacing:.05em;
    color:#8fd0ff; opacity:.85; text-shadow:0 0 10px rgba(90,190,255,.6); }
  .cert { position:absolute; bottom:30px; left:36px; border:2px solid #cfe6ff;
    border-radius:5px; padding:3px 8px; font-family:"Helvetica Neue",Arial;
    font-size:14px; font-weight:800; color:#cfe6ff; letter-spacing:.08em; opacity:.85; }
</style>
</head>
<body>
  <div class="glow-a"></div>
  <div class="wall" id="wall"></div>
  <div class="scan"></div>
  <div class="vig"></div>

  <div class="studio">MESH&nbsp;GENERATION&nbsp;MEDIA&nbsp;&nbsp;·&nbsp;&nbsp;PRESENTS</div>

  <div class="stage">
    <div class="title">
      <span class="up">H</span><span class="dn">A</span><span class="up">C</span><span class="dn">K</span><span class="up">E</span><span class="dn">R</span><span class="up">S</span>
    </div>
    <div class="tag">THEIR&nbsp;CRIME&nbsp;IS&nbsp;CURIOSITY</div>
  </div>

  <div class="bar">
    <span class="chip star">★★★★<span class="dot">☆</span> <b>7.6</b></span>
    <span class="dot">|</span>
    <span class="chip">1995 · <b>DEF&nbsp;CON&nbsp;34</b> REMASTER</span>
    <span class="dot">|</span>
    <span class="watch">▶ WATCH NOW</span>
  </div>
  <div class="cert">DC&nbsp;34</div>
  <div class="url">run.defcon.run</div>

<script>
  // fill the monitor wall with pseudo "code" so it reads as a CRT bank
  var glyphs = "01x#$@%&*/\\<>[]{}=+-01ABCDEF0xACCESS GRANTED HACK THE PLANET ZERO COOL CRASH OVERRIDE ".split("");
  var snips = [
    "root@gibson:~# ./crack --plan\n> bypassing ICE...\n> ACCESS GRANTED\n0xDEADBEEF 0xCAFEB",
    "for(;;){ if(hack()) planet();\n  trace=null; }\n// their crime is\n// curiosity",
    "GET /garbage HTTP/1.0\n> 22 33 44 55 66\n> RISC architecture\n> is gonna change",
    "$ nmap -sS gibson\n1337/tcp open  elite\n> mess with the best\n> die like the rest",
    "0100 1000 0100 0001\n0100 0011 0100 1011\n> zero cool\n> crash override",
    "connecting run.defcon.run\n> bib::acquired\n> mesh::flashed\n> HACK THE PLANET"
  ];
  var wall = document.getElementById("wall");
  for (var i=0;i<24;i++){
    var m = document.createElement("div"); m.className="mon";
    var pre = document.createElement("pre");
    pre.textContent = snips[i % snips.length];
    m.appendChild(pre); wall.appendChild(m);
  }
</script>
</body>
</html>
