<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  /* Strava club cover: upload 1180x579; web crops to the middle ~393px band,
     so ALL text lives in a vertically-centered safe zone. */
  html,body { width:1180px; height:579px; overflow:hidden; }
  :root{
    --cy:#2fe3c6;   /* DC34 mint-teal neon */
    --mg:#ff2e97;   /* DC34 magenta */
    --ice:#d7fff6;
  }
  body {
    font-family: "Arial Black", Impact, "Helvetica Neue", sans-serif;
    background:#04060d; position:relative;
  }
  .glow-a { position:absolute; inset:0;
    background:
      radial-gradient(60% 90% at 15% 10%,  rgba(47,227,198,.34), transparent 60%),
      radial-gradient(70% 100% at 90% 100%, rgba(255,46,151,.40), transparent 60%),
      radial-gradient(50% 70% at 55% 45%, rgba(20,150,130,.24), transparent 65%);
  }
  .wall { position:absolute; inset:0; display:grid;
    grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(4,1fr);
    gap:10px; padding:14px; opacity:.32; }
  .mon { border:2px solid rgba(60,200,180,.22); border-radius:4px;
    background:linear-gradient(180deg, rgba(8,40,36,.5), rgba(4,10,14,.7));
    overflow:hidden; position:relative; box-shadow:inset 0 0 30px rgba(0,0,0,.7); }
  .mon pre { color:rgba(90,255,180,.42); font:9px/1.35 "Courier New",monospace;
    padding:6px; white-space:pre-wrap; word-break:break-all; text-shadow:0 0 6px rgba(60,255,150,.5); }

  /* neon wireframe rabbit watermark, centered, dimmed so text stays legible */
  .bunny { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    height:560px; mix-blend-mode:screen; opacity:.34;
    filter: drop-shadow(0 0 14px rgba(47,227,198,.9)) drop-shadow(0 0 42px rgba(90,190,255,.5)); }

  .scan { position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.26) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply; }
  .vig { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 120% at 50% 50%, transparent 50%, rgba(0,0,0,.8)); }

  /* everything centered -> lands inside the web safe band */
  .stage { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:0; }

  .studio { letter-spacing:.32em; font-size:16px; font-weight:800; color:#d7fff6;
    opacity:.9; text-shadow:0 0 12px rgba(47,227,198,.75); margin-bottom:6px; }

  .title { font-size:108px; line-height:.84; letter-spacing:0; color:var(--cy);
    text-shadow:
      0 0 2px var(--ice), 0 0 22px rgba(47,227,198,.95), 0 0 60px rgba(47,227,198,.7),
      4px 4px 0 #12836f, 5px 5px 0 #0c5a4d, 0 0 90px rgba(255,46,151,.4);
    transform:skewX(-6deg); white-space:nowrap; }
  .title span { display:inline-block; }
  .title .up { transform:translateY(-10px); }
  .title .dn { transform:translateY(10px); }
  .title .bang { color:var(--mg); text-shadow:0 0 2px #ffe6f3,
    0 0 24px rgba(255,46,151,.95), 4px 4px 0 #8f1857; transform:translateY(-10px); }
  .title .sp { width:.28em; }

  .tag { margin-top:16px; letter-spacing:.30em; font-size:26px; font-weight:800;
    color:#ffd0ec; text-shadow:0 0 16px rgba(255,46,151,.9); }
  .subtag { margin-top:9px; letter-spacing:.14em; font-size:18px; font-weight:800;
    color:#c6fff2; opacity:.92; text-shadow:0 0 12px rgba(47,227,198,.6);
    font-family:"Helvetica Neue",Arial,sans-serif; }

  .foot { margin-top:16px; display:flex; align-items:center; gap:20px;
    font-family:"Helvetica Neue",Arial,sans-serif; }
  .url { font-family:"Courier New",monospace; font-size:18px; font-weight:700;
    letter-spacing:.06em; color:var(--cy); text-shadow:0 0 12px rgba(47,227,198,.7); }
  .dot { color:#3f7d70; }
  .logos { display:flex; align-items:center; gap:16px; }
  .logos img { height:40px; }
  .logos .jack { filter:brightness(0) invert(1) drop-shadow(0 0 9px rgba(47,227,198,.85)); opacity:.92; }
  .logos .mesh { filter:drop-shadow(0 0 9px rgba(47,227,198,.7)); }
  .logos .dc34 { filter:drop-shadow(0 0 10px rgba(255,46,151,.5)); height:48px; }
</style>
</head>
<body>
  <div class="glow-a"></div>
  <div class="wall" id="wall"></div>
  <img class="bunny" src="bunny-head.png" alt="">
  <div class="scan"></div>
  <div class="vig"></div>

  <div class="stage">
    <div class="studio">D E F&nbsp;C O N&nbsp;&nbsp;3 4&nbsp;&nbsp;·&nbsp;&nbsp;R U N&nbsp;&nbsp;C R E W</div>
    <div class="title">
      <span class="up">R</span><span class="dn">U</span><span class="up">N</span><span class="sp"></span><span class="dn">H</span><span class="up">A</span><span class="dn">C</span><span class="up">K</span><span class="dn">E</span><span class="up">R</span><span class="sp"></span><span class="dn">R</span><span class="up">U</span><span class="dn">N</span><span class="bang">!</span>
    </div>
    <div class="tag">THE&nbsp;OFFICIAL&nbsp;DEF&nbsp;CON&nbsp;34&nbsp;RUN&nbsp;CREW</div>
    <div class="subtag">👟&nbsp;&nbsp;JOIN US ON THE STREETS OF LAS VEGAS&nbsp;&nbsp;·&nbsp;&nbsp;AUG 2026&nbsp;&nbsp;👟</div>
    <div class="foot">
      <span class="url">run.defcon.run</span>
      <span class="dot">|</span>
      <span class="logos">
        <img class="jack" src="dcjack.svg" alt="">
        <img class="dc34" src="dc34.png" alt="">
        <img class="mesh" src="meshtastic.svg" alt="">
      </span>
    </div>
  </div>

<script>
  var snips = [
    "root@gibson:~# ./run --vegas\n> lacing up...\n> ACCESS GRANTED\n0xDEADBEEF 0xCAFEB",
    "for(;;){ run(); wave(); }\n// join the crew\n// run the strip",
    "GET /the-strip HTTP/1.0\n> 22 33 44 55 66\n> pace::easy\n> vibes::high",
    "$ nmap -sS gibson\n1337/tcp open  elite\n> mess with the best\n> run like the rest",
    "0101 0010 0101 0101\n0100 1110 0010 0001\n> zero cool\n> crash override",
    "connecting run.defcon.run\n> bib::acquired\n> mesh::flashed\n> RUN THE PLANET"
  ];
  var wall = document.getElementById("wall");
  for (var i=0;i<32;i++){
    var m = document.createElement("div"); m.className="mon";
    var pre = document.createElement("pre");
    pre.textContent = snips[i % snips.length];
    m.appendChild(pre); wall.appendChild(m);
  }
</script>
</body>
</html>
