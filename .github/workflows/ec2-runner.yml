name: "🏗️ Infra: EC2 Runner"

run-name: EC2 Runner - ${{ inputs.action }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        type: choice
        options:
          - start
          - stop
          - status
        default: status
      instance_type:
        description: 'EC2 instance type (for start)'
        type: choice
        options:
          # Compute optimized - best for builds
          - c6i.4xlarge    # 16 vCPU, 32 GB  (~$0.68/hr on-demand, ~$0.14/hr spot)
          - c6i.8xlarge    # 32 vCPU, 64 GB  (~$1.36/hr on-demand, ~$0.27/hr spot)
          - c6i.12xlarge   # 48 vCPU, 96 GB  (~$2.04/hr on-demand, ~$0.41/hr spot)
          - c7i.4xlarge    # 16 vCPU, 32 GB  (newer gen, ~15% faster)
          - c7i.8xlarge    # 32 vCPU, 64 GB
          # General purpose - balanced
          - m6i.4xlarge    # 16 vCPU, 64 GB  (~$0.77/hr on-demand)
          - m6i.8xlarge    # 32 vCPU, 128 GB (~$1.54/hr on-demand)
          - m7i.4xlarge    # 16 vCPU, 64 GB  (newer gen)
          # Memory optimized - for large builds
          - r6i.4xlarge    # 16 vCPU, 128 GB (~$1.01/hr on-demand)
          - r6i.8xlarge    # 32 vCPU, 256 GB (~$2.02/hr on-demand)
        default: c6i.4xlarge
      market_type:
        description: 'Instance market type'
        type: choice
        options:
          - on-demand
          - spot
          - spot-with-fallback
        default: on-demand
      region:
        description: 'AWS region'
        type: string
        default: us-east-1

env:
  RUNNER_NAME: dc34-release-runner

jobs:
  # ============================================================================
  # Start a new EC2 runner
  # ============================================================================
  start:
    if: inputs.action == 'start'
    name: Start EC2 Runner
    runs-on: ubuntu-latest
    environment: ec2-runner

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/dc34-github-release
          aws-region: ${{ inputs.region }}

      - name: Get Ubuntu AMI for region
        id: ami
        run: |
          AMI_ID=$(aws ec2 describe-images \
            --owners 099720109477 \
            --filters "Name=name,Values=ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*" \
            --query 'Images | sort_by(@, &CreationDate) | [-1].ImageId' \
            --output text)
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "Using Ubuntu 22.04 AMI: $AMI_ID"

      - name: Discover VPC resources
        id: vpc
        run: |
          set +e  # Don't exit on error, we handle fallbacks

          # Find a public subnet by Name tag containing "public" and "defcon"
          SUBNET_ID=$(aws ec2 describe-subnets \
            --query "Subnets[?contains(Tags[?Key=='Name'].Value | [0], 'public') && contains(Tags[?Key=='Name'].Value | [0], 'defcon')].SubnetId | [0]" \
            --output text 2>/dev/null)

          # Fallback: any subnet with "public" in name
          if [[ -z "$SUBNET_ID" || "$SUBNET_ID" == "None" ]]; then
            SUBNET_ID=$(aws ec2 describe-subnets \
              --query "Subnets[?contains(Tags[?Key=='Name'].Value | [0], 'public')].SubnetId | [0]" \
              --output text 2>/dev/null)
          fi

          if [[ -z "$SUBNET_ID" || "$SUBNET_ID" == "None" ]]; then
            echo "::error::No public subnet found. Looking for subnet with 'public' in Name tag."
            aws ec2 describe-subnets --query "Subnets[*].[SubnetId, Tags[?Key=='Name'].Value | [0]]" --output table
            exit 1
          fi

          # Get VPC ID from subnet
          VPC_ID=$(aws ec2 describe-subnets \
            --subnet-ids "$SUBNET_ID" \
            --query 'Subnets[0].VpcId' \
            --output text)

          # Find security group by name pattern (securemgmt)
          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "SecurityGroups[?contains(GroupName, 'securemgmt')].GroupId | [0]" \
            --output text 2>/dev/null)

          # Fallback: use default security group for the VPC
          if [[ -z "$SG_ID" || "$SG_ID" == "None" ]]; then
            SG_ID=$(aws ec2 describe-security-groups \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=group-name,Values=default" \
              --query 'SecurityGroups[0].GroupId' \
              --output text)
          fi

          if [[ -z "$SG_ID" || "$SG_ID" == "None" ]]; then
            echo "::error::No security group found"
            exit 1
          fi

          echo "subnet_id=$SUBNET_ID" >> $GITHUB_OUTPUT
          echo "security_group_id=$SG_ID" >> $GITHUB_OUTPUT
          echo "vpc_id=$VPC_ID" >> $GITHUB_OUTPUT
          echo "✅ Found: subnet=$SUBNET_ID, sg=$SG_ID, vpc=$VPC_ID"

      - name: Check for existing runner
        id: check
        run: |
          EXISTING=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.RUNNER_NAME }}" \
                      "Name=instance-state-name,Values=running,pending" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [[ -n "$EXISTING" ]]; then
            echo "existing=true" >> $GITHUB_OUTPUT
            echo "instance_id=$EXISTING" >> $GITHUB_OUTPUT
            echo "⚠️ Runner already exists: $EXISTING" >> $GITHUB_STEP_SUMMARY
          else
            echo "existing=false" >> $GITHUB_OUTPUT
          fi

      - name: Get spot price
        if: inputs.market_type != 'on-demand' && steps.check.outputs.existing != 'true'
        id: spot-price
        run: |
          # Get current spot price for the instance type in the subnet's AZ
          AZ=$(aws ec2 describe-subnets \
            --subnet-ids "${{ steps.vpc.outputs.subnet_id }}" \
            --query 'Subnets[0].AvailabilityZone' \
            --output text)

          SPOT_PRICE=$(aws ec2 describe-spot-price-history \
            --instance-types ${{ inputs.instance_type }} \
            --product-descriptions "Linux/UNIX" \
            --availability-zone "$AZ" \
            --query 'SpotPriceHistory[0].SpotPrice' \
            --output text)

          echo "Current spot price in $AZ: \$$SPOT_PRICE/hr"
          echo "spot_price=$SPOT_PRICE" >> $GITHUB_OUTPUT
          echo "availability_zone=$AZ" >> $GITHUB_OUTPUT

      - name: Start EC2 Runner
        if: steps.check.outputs.existing != 'true'
        id: start-runner
        continue-on-error: ${{ inputs.market_type == 'spot-with-fallback' }}
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.GH_RUNNER_TOKEN }}
          ec2-image-id: ${{ steps.ami.outputs.ami_id }}
          ec2-instance-type: ${{ inputs.instance_type }}
          subnet-id: ${{ steps.vpc.outputs.subnet_id }}
          security-group-id: ${{ steps.vpc.outputs.security_group_id }}
          iam-role-name: dc34-dc34-github-runner
          label: dc34-release-runner
          market-type: ${{ inputs.market_type != 'on-demand' && 'spot' || '' }}
          ec2-volume-size: 30
          aws-resource-tags: >
            [
              {"Key": "Name", "Value": "${{ env.RUNNER_NAME }}"},
              {"Key": "Project", "Value": "defcon.run.34"},
              {"Key": "Purpose", "Value": "release-build"},
              {"Key": "KeepAlive", "Value": "true"},
              {"Key": "MarketType", "Value": "${{ inputs.market_type }}"}
            ]
          startup-timeout-minutes: 10
          pre-runner-script: |
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg 2>/dev/null
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main' | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq jq docker.io awscli gh
            sudo usermod -aG docker ubuntu
            sudo systemctl enable docker
            sudo systemctl start docker
            mkdir -p /usr/local/lib/docker/cli-plugins
            curl -sLo /usr/local/lib/docker/cli-plugins/docker-buildx https://github.com/docker/buildx/releases/download/v0.12.1/buildx-v0.12.1.linux-amd64
            chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx

      - name: Start EC2 Runner (Fallback to On-Demand)
        if: |
          inputs.market_type == 'spot-with-fallback' &&
          steps.check.outputs.existing != 'true' &&
          steps.start-runner.outcome == 'failure'
        id: start-runner-fallback
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.GH_RUNNER_TOKEN }}
          ec2-image-id: ${{ steps.ami.outputs.ami_id }}
          ec2-instance-type: ${{ inputs.instance_type }}
          subnet-id: ${{ steps.vpc.outputs.subnet_id }}
          security-group-id: ${{ steps.vpc.outputs.security_group_id }}
          iam-role-name: dc34-dc34-github-runner
          label: dc34-release-runner
          ec2-volume-size: 30
          aws-resource-tags: >
            [
              {"Key": "Name", "Value": "${{ env.RUNNER_NAME }}"},
              {"Key": "Project", "Value": "defcon.run.34"},
              {"Key": "Purpose", "Value": "release-build"},
              {"Key": "KeepAlive", "Value": "true"},
              {"Key": "MarketType", "Value": "on-demand-fallback"}
            ]
          startup-timeout-minutes: 10
          pre-runner-script: |
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg 2>/dev/null
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main' | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq jq docker.io awscli gh
            sudo usermod -aG docker ubuntu
            sudo systemctl enable docker
            sudo systemctl start docker
            mkdir -p /usr/local/lib/docker/cli-plugins
            curl -sLo /usr/local/lib/docker/cli-plugins/docker-buildx https://github.com/docker/buildx/releases/download/v0.12.1/buildx-v0.12.1.linux-amd64
            chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx

      - name: Tag with fixed name
        if: steps.check.outputs.existing != 'true' && (steps.start-runner.outputs.ec2-instance-id || steps.start-runner-fallback.outputs.ec2-instance-id)
        run: |
          # Add the runner label as a tag for easy lookup
          INSTANCE_ID="${{ steps.start-runner.outputs.ec2-instance-id || steps.start-runner-fallback.outputs.ec2-instance-id }}"
          LABEL="${{ steps.start-runner.outputs.label || steps.start-runner-fallback.outputs.label }}"
          aws ec2 create-tags \
            --resources "$INSTANCE_ID" \
            --tags Key=RunnerLabel,Value="$LABEL"

      - name: Output Runner Info
        run: |
          echo "## EC2 Runner Started" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.check.outputs.existing }}" == "true" ]]; then
            echo "⚠️ **Using existing runner**" >> $GITHUB_STEP_SUMMARY
            echo "**Instance ID:** ${{ steps.check.outputs.instance_id }}" >> $GITHUB_STEP_SUMMARY
          else
            INSTANCE_ID="${{ steps.start-runner.outputs.ec2-instance-id || steps.start-runner-fallback.outputs.ec2-instance-id }}"
            RUNNER_LABEL="${{ steps.start-runner.outputs.label || steps.start-runner-fallback.outputs.label }}"

            # Determine market type used
            if [[ -n "${{ steps.start-runner-fallback.outputs.ec2-instance-id }}" ]]; then
              MARKET="on-demand (fallback from spot)"
            else
              MARKET="${{ inputs.market_type }}"
            fi

            echo "**Instance ID:** $INSTANCE_ID" >> $GITHUB_STEP_SUMMARY
            echo "**Runner Label:** $RUNNER_LABEL" >> $GITHUB_STEP_SUMMARY
            echo "**Instance Type:** ${{ inputs.instance_type }}" >> $GITHUB_STEP_SUMMARY
            echo "**Market Type:** $MARKET" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ inputs.market_type }}" != "on-demand" && -n "${{ steps.spot-price.outputs.spot_price }}" ]]; then
              echo "**Spot Price:** \$${{ steps.spot-price.outputs.spot_price }}/hr (in ${{ steps.spot-price.outputs.availability_zone }})" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Run **Release** workflow with runner type: **ec2-reuse-existing**" >> $GITHUB_STEP_SUMMARY
          echo "2. When done, run **EC2 Runner** workflow with action: **stop**" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Stop existing EC2 runner
  # ============================================================================
  stop:
    if: inputs.action == 'stop'
    name: Stop EC2 Runner
    runs-on: ubuntu-latest
    environment: ec2-runner

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/dc34-github-release
          aws-region: ${{ inputs.region }}

      - name: Find and stop runner
        run: |
          # Find running instances with our tag
          INSTANCES=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.RUNNER_NAME }}" \
                      "Name=instance-state-name,Values=running,pending" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [[ -z "$INSTANCES" ]]; then
            echo "No running runners found" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "## Stopping EC2 Runners" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for INSTANCE_ID in $INSTANCES; do
            echo "Terminating: $INSTANCE_ID"
            aws ec2 terminate-instances --instance-ids "$INSTANCE_ID"
            echo "- Terminated: \`$INSTANCE_ID\`" >> $GITHUB_STEP_SUMMARY
          done

      - name: Cleanup GitHub runners
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_TOKEN }}
        run: |
          # List offline runners and remove them
          OFFLINE_RUNNERS=$(gh api /repos/${{ github.repository }}/actions/runners \
            --jq '.runners[] | select(.status == "offline") | select(.name | startswith("ec2-")) | .id')

          for RUNNER_ID in $OFFLINE_RUNNERS; do
            echo "Removing offline runner: $RUNNER_ID"
            gh api -X DELETE /repos/${{ github.repository }}/actions/runners/$RUNNER_ID || true
          done

  # ============================================================================
  # Show status of EC2 runners
  # ============================================================================
  status:
    if: inputs.action == 'status'
    name: Check Runner Status
    runs-on: ubuntu-latest
    environment: ec2-runner

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/dc34-github-release
          aws-region: ${{ inputs.region }}

      - name: Check EC2 instances
        run: |
          echo "## EC2 Runner Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          INSTANCES=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=defcon.run.34" \
                      "Name=tag:Purpose,Values=release-build" \
            --query 'Reservations[].Instances[].[InstanceId,State.Name,InstanceType,InstanceLifecycle,LaunchTime,Tags[?Key==`RunnerLabel`].Value|[0]]' \
            --output text)

          if [[ -z "$INSTANCES" ]]; then
            echo "No EC2 runners found." >> $GITHUB_STEP_SUMMARY
          else
            echo "| Instance ID | State | Type | Lifecycle | Launch Time | Runner Label |" >> $GITHUB_STEP_SUMMARY
            echo "|-------------|-------|------|-----------|-------------|--------------|" >> $GITHUB_STEP_SUMMARY
            echo "$INSTANCES" | while read -r INSTANCE_ID STATE TYPE LIFECYCLE LAUNCH_TIME LABEL; do
              # InstanceLifecycle is null/None for on-demand instances
              LIFECYCLE="${LIFECYCLE:-on-demand}"
              [[ "$LIFECYCLE" == "None" ]] && LIFECYCLE="on-demand"
              echo "| \`$INSTANCE_ID\` | $STATE | $TYPE | $LIFECYCLE | $LAUNCH_TIME | ${LABEL:-N/A} |" >> $GITHUB_STEP_SUMMARY
            done
          fi

      - name: Check GitHub runners
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_TOKEN }}
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitHub Self-Hosted Runners" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          RUNNERS=$(gh api /repos/${{ github.repository }}/actions/runners \
            --jq '.runners[] | select(.name | startswith("ec2-")) | [.name, .status, .busy] | @tsv' 2>/dev/null || echo "")

          if [[ -z "$RUNNERS" ]]; then
            echo "No EC2-based GitHub runners registered." >> $GITHUB_STEP_SUMMARY
          else
            echo "| Runner Name | Status | Busy |" >> $GITHUB_STEP_SUMMARY
            echo "|-------------|--------|------|" >> $GITHUB_STEP_SUMMARY
            echo "$RUNNERS" | while read -r NAME STATUS BUSY; do
              echo "| \`$NAME\` | $STATUS | $BUSY |" >> $GITHUB_STEP_SUMMARY
            done
          fi
