name: "🚀 Deploy: Build & Publish"

run-name: "Build+Pub(${{ inputs.apps || 'all' }}) → ${{ inputs.regions || 'use1' }}${{ inputs.deploy && ' + Deploy' || '' }}"

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Apps to build (comma-separated)'
        type: string
        default: 'run.auth,run.human,run.cms,run.gpx,run.flash,run.bib,run.mqtt'
      regions:
        description: 'Target regions'
        type: choice
        options:
          - use1
          - cac1
          - apse1
          - use1,cac1
          - use1,apse1
          - cac1,apse1
          - use1,cac1,apse1
        default: use1
      runner:
        description: 'Runner type'
        type: choice
        options:
          - github-hosted
          - ec2-ephemeral
          - ec2-start-and-keep
          - ec2-reuse-existing
        default: github-hosted
      ec2_instance_type:
        description: 'EC2 instance type (for EC2 runners)'
        type: choice
        options:
          # Compute optimized - best for builds
          - c6i.4xlarge    # 16 vCPU, 32 GB  (~$0.14/hr spot)
          - c6i.8xlarge    # 32 vCPU, 64 GB  (~$0.27/hr spot)
          - c6i.12xlarge   # 48 vCPU, 96 GB  (~$0.41/hr spot)
          - c7i.4xlarge    # 16 vCPU, 32 GB  (newer gen)
          - c7i.8xlarge    # 32 vCPU, 64 GB
          # General purpose - balanced
          - m6i.4xlarge    # 16 vCPU, 64 GB
          - m6i.8xlarge    # 32 vCPU, 128 GB
          - m7i.4xlarge    # 16 vCPU, 64 GB  (newer gen)
          # Memory optimized - for large builds
          - r6i.4xlarge    # 16 vCPU, 128 GB
          - r6i.8xlarge    # 32 vCPU, 256 GB
        default: c6i.4xlarge
      ec2_market_type:
        description: 'EC2 market type (for EC2 runners)'
        type: choice
        options:
          - spot
          - on-demand
        default: spot
      parallel:
        description: 'Build apps in parallel'
        type: boolean
        default: true
      skip_bump:
        description: 'Skip version bump (use existing versions)'
        type: boolean
        default: false
      create_pr:
        description: 'Create and merge PR'
        type: boolean
        default: true
      deploy:
        description: 'Deploy to ECS + invalidate cache after build'
        type: boolean
        default: true

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

jobs:
  # ============================================================================
  # Option 1: GitHub-hosted runner (slower but simple)
  # ============================================================================
  build-github-hosted:
    if: inputs.runner == 'github-hosted'
    name: Build+Pub (GitHub)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}

    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version bumping

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/dc34-github-release
          aws-region: us-east-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Discover available ECR regions
        id: regions
        run: |
          REQUESTED="${{ inputs.regions }}"
          AVAILABLE=""
          SKIPPED=""

          for code in $(echo "$REQUESTED" | tr ',' ' '); do
            case "$code" in
              use1)  aws_region="us-east-1" ;;
              cac1)  aws_region="ca-central-1" ;;
              apse1) aws_region="ap-southeast-1" ;;
              *)     continue ;;
            esac

            # Check for a known ECR repo as proxy for "region is deployed"
            PROBE=$(aws ecr describe-repositories \
              --repository-names dc34-run-human-app \
              --region "$aws_region" 2>&1) && RC=0 || RC=$?

            if [[ $RC -eq 0 ]]; then
              AVAILABLE="${AVAILABLE:+$AVAILABLE,}$code"
              echo "✅ $code ($aws_region): ECR repos found"
            elif echo "$PROBE" | grep -q "RepositoryNotFoundException"; then
              SKIPPED="${SKIPPED:+$SKIPPED,}$code"
              echo "⏭️ $code ($aws_region): no ECR repos — skipping"
            else
              AVAILABLE="${AVAILABLE:+$AVAILABLE,}$code"
              echo "⚠️ $code ($aws_region): probe error, assuming available"
            fi
          done

          if [[ -z "$AVAILABLE" ]]; then
            echo "::error::No ECR repos found in any selected region ($REQUESTED)"
            exit 1
          fi

          echo "regions=$AVAILABLE" >> $GITHUB_OUTPUT
          echo "skipped=${SKIPPED:-none}" >> $GITHUB_OUTPUT
          echo ""
          echo "Requested: $REQUESTED"
          echo "Available: $AVAILABLE"
          if [[ -n "$SKIPPED" ]]; then echo "Skipped:   $SKIPPED"; fi

      - name: Login to ECR (us-east-1)
        if: contains(steps.regions.outputs.regions, 'use1')
        run: |
          aws ecr get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Login to ECR (ca-central-1)
        if: contains(steps.regions.outputs.regions, 'cac1')
        run: |
          aws ecr get-login-password --region ca-central-1 | \
            docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ca-central-1.amazonaws.com

      - name: Login to ECR (ap-southeast-1)
        if: contains(steps.regions.outputs.regions, 'apse1')
        run: |
          aws ecr get-login-password --region ap-southeast-1 | \
            docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release-all.sh
        id: release
        env:
          SKIP_ECR_LOGIN: "true"  # Already logged in above
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS="--apps ${{ inputs.apps }} --regions ${{ steps.regions.outputs.regions }}"

          if [[ "${{ inputs.parallel }}" == "true" ]]; then
            ARGS="$ARGS --parallel"
          fi

          if [[ "${{ inputs.skip_bump }}" == "true" ]]; then
            ARGS="$ARGS --skip-bump"
          fi

          if [[ "${{ inputs.create_pr }}" == "true" ]]; then
            # Create PR but don't auto-merge (we'll do it separately with admin token)
            ARGS="$ARGS --pr --no-merge"
          else
            ARGS="$ARGS --push"
          fi

          echo "Running: ./apps/release-all.sh $ARGS"
          # Capture output to extract PR URL
          OUTPUT=$(./apps/release-all.sh $ARGS 2>&1 | tee /dev/stderr)

          # Extract PR URL from output
          PR_URL=$(echo "$OUTPUT" | grep -oE 'https://github.com/[^/]+/[^/]+/pull/[0-9]+' | head -1 || true)
          if [[ -n "$PR_URL" ]]; then
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi

      - name: Merge PR
        id: merge
        if: inputs.create_pr && steps.release.outputs.pr_number
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.release.outputs.pr_number }}"
          echo "Merging PR #${PR_NUMBER} with admin token..."

          if gh pr merge "$PR_NUMBER" --squash --delete-branch --admin; then
            echo "✅ PR #${PR_NUMBER} merged successfully"
            # Capture merge commit SHA so deploy jobs checkout the correct ref
            sleep 2
            MERGE_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit --jq '.mergeCommit.oid')
            echo "merge_sha=$MERGE_SHA" >> $GITHUB_OUTPUT
            echo "Merge SHA: $MERGE_SHA"
          else
            echo "⚠️ Auto-merge failed. PR may need manual merge."
            echo "PR: ${{ steps.release.outputs.pr_url }}"
            # Don't fail the workflow - builds succeeded
          fi

      - name: Generate Summary
        if: always()
        run: |
          echo "## Build+Pub Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Apps:** ${{ inputs.apps }}" >> $GITHUB_STEP_SUMMARY
          echo "**Regions:** ${{ steps.regions.outputs.regions }}" >> $GITHUB_STEP_SUMMARY
          SKIPPED="${{ steps.regions.outputs.skipped }}"
          if [[ "$SKIPPED" != "none" ]]; then
            echo "**Skipped:** $SKIPPED (no ECR repos)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Runner:** GitHub-hosted (ubuntu-latest)" >> $GITHUB_STEP_SUMMARY
          echo "**Parallel:** ${{ inputs.parallel }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Option 2: Self-hosted EC2 runner (faster, more powerful)
  #
  # Runner modes:
  #   ec2-ephemeral:      Start → Build → Stop (one-shot)
  #   ec2-start-and-keep: Start → Build → Keep running (reuse later)
  #   ec2-reuse-existing: Use existing runner → Build (no start/stop)
  # ============================================================================

  # Start EC2 runner (for ephemeral and start-and-keep modes)
  start-ec2-runner:
    if: inputs.runner == 'ec2-ephemeral' || inputs.runner == 'ec2-start-and-keep'
    name: Start EC2 Runner
    runs-on: ubuntu-latest
    outputs:
      runner-label: ${{ steps.start-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-runner.outputs.ec2-instance-id }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/dc34-github-release
          aws-region: us-east-1

      - name: Get Ubuntu AMI
        id: ami
        run: |
          AMI_ID=$(aws ec2 describe-images \
            --owners 099720109477 \
            --filters "Name=name,Values=ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*" \
            --query 'Images | sort_by(@, &CreationDate) | [-1].ImageId' \
            --output text)
          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "Using Ubuntu 22.04 AMI: $AMI_ID"

      - name: Discover VPC resources
        id: vpc
        run: |
          set +e  # Don't exit on error, we handle fallbacks

          # Find a public subnet by Name tag containing "public" and "defcon"
          SUBNET_ID=$(aws ec2 describe-subnets \
            --query "Subnets[?contains(Tags[?Key=='Name'].Value | [0], 'public') && contains(Tags[?Key=='Name'].Value | [0], 'defcon')].SubnetId | [0]" \
            --output text 2>/dev/null)

          # Fallback: any subnet with "public" in name
          if [[ -z "$SUBNET_ID" || "$SUBNET_ID" == "None" ]]; then
            SUBNET_ID=$(aws ec2 describe-subnets \
              --query "Subnets[?contains(Tags[?Key=='Name'].Value | [0], 'public')].SubnetId | [0]" \
              --output text 2>/dev/null)
          fi

          if [[ -z "$SUBNET_ID" || "$SUBNET_ID" == "None" ]]; then
            echo "::error::No public subnet found"
            exit 1
          fi

          # Get VPC ID from subnet
          VPC_ID=$(aws ec2 describe-subnets \
            --subnet-ids "$SUBNET_ID" \
            --query 'Subnets[0].VpcId' \
            --output text)

          # Find security group by name pattern (securemgmt)
          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query "SecurityGroups[?contains(GroupName, 'securemgmt')].GroupId | [0]" \
            --output text 2>/dev/null)

          # Fallback: use default security group for the VPC
          if [[ -z "$SG_ID" || "$SG_ID" == "None" ]]; then
            SG_ID=$(aws ec2 describe-security-groups \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=group-name,Values=default" \
              --query 'SecurityGroups[0].GroupId' \
              --output text)
          fi

          if [[ -z "$SG_ID" || "$SG_ID" == "None" ]]; then
            echo "::error::No security group found"
            exit 1
          fi

          echo "subnet_id=$SUBNET_ID" >> $GITHUB_OUTPUT
          echo "security_group_id=$SG_ID" >> $GITHUB_OUTPUT
          echo "✅ Found: subnet=$SUBNET_ID, sg=$SG_ID"

      - name: Start EC2 Runner
        id: start-runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.GH_RUNNER_TOKEN }}
          ec2-image-id: ${{ steps.ami.outputs.ami_id }}
          ec2-instance-type: ${{ inputs.ec2_instance_type }}
          market-type: ${{ inputs.ec2_market_type }}
          subnet-id: ${{ steps.vpc.outputs.subnet_id }}
          security-group-id: ${{ steps.vpc.outputs.security_group_id }}
          iam-role-name: dc34-github-runner
          ec2-volume-size: 30
          label: ${{ inputs.runner == 'ec2-start-and-keep' && 'dc34-release-runner' || '' }}
          aws-resource-tags: >
            [
              {"Key": "Name", "Value": "dc34-release-runner"},
              {"Key": "Project", "Value": "defcon.run.34"},
              {"Key": "Purpose", "Value": "release-build"},
              {"Key": "KeepAlive", "Value": "${{ inputs.runner == 'ec2-start-and-keep' && 'true' || 'false' }}"}
            ]
          startup-timeout-minutes: 10
          pre-runner-script: |
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg 2>/dev/null
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main' | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq jq docker.io awscli gh
            sudo usermod -aG docker ubuntu
            sudo systemctl enable docker
            sudo systemctl start docker
            mkdir -p /usr/local/lib/docker/cli-plugins
            curl -sLo /usr/local/lib/docker/cli-plugins/docker-buildx https://github.com/docker/buildx/releases/download/v0.12.1/buildx-v0.12.1.linux-amd64
            chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx

      - name: Output Runner Info
        run: |
          echo "## EC2 Runner Started" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Instance ID:** ${{ steps.start-runner.outputs.ec2-instance-id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Runner Label:** ${{ steps.start-runner.outputs.label }}" >> $GITHUB_STEP_SUMMARY
          echo "**Instance Type:** ${{ inputs.ec2_instance_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Market Type:** ${{ inputs.ec2_market_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Keep Alive:** ${{ inputs.runner == 'ec2-start-and-keep' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ inputs.runner }}" == "ec2-start-and-keep" ]]; then
            echo "⚠️ **Runner will stay running after build. Use 'EC2 Runner: Stop' workflow to terminate.**" >> $GITHUB_STEP_SUMMARY
          fi

  # Run build on newly started EC2 runner
  build-ec2-new:
    if: inputs.runner == 'ec2-ephemeral' || inputs.runner == 'ec2-start-and-keep'
    name: Build+Pub (EC2)
    needs: start-ec2-runner
    runs-on: ${{ needs.start-ec2-runner.outputs.runner-label }}
    timeout-minutes: 30

    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}

    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/dc34-github-release
          aws-region: us-east-1

      - name: Discover available ECR regions
        id: regions
        run: |
          REQUESTED="${{ inputs.regions }}"
          AVAILABLE=""
          SKIPPED=""

          for code in $(echo "$REQUESTED" | tr ',' ' '); do
            case "$code" in
              use1)  aws_region="us-east-1" ;;
              cac1)  aws_region="ca-central-1" ;;
              apse1) aws_region="ap-southeast-1" ;;
              *)     continue ;;
            esac

            PROBE=$(aws ecr describe-repositories \
              --repository-names dc34-run-human-app \
              --region "$aws_region" 2>&1) && RC=0 || RC=$?

            if [[ $RC -eq 0 ]]; then
              AVAILABLE="${AVAILABLE:+$AVAILABLE,}$code"
              echo "✅ $code ($aws_region): ECR repos found"
            elif echo "$PROBE" | grep -q "RepositoryNotFoundException"; then
              SKIPPED="${SKIPPED:+$SKIPPED,}$code"
              echo "⏭️ $code ($aws_region): no ECR repos — skipping"
            else
              AVAILABLE="${AVAILABLE:+$AVAILABLE,}$code"
              echo "⚠️ $code ($aws_region): probe error, assuming available"
            fi
          done

          if [[ -z "$AVAILABLE" ]]; then
            echo "::error::No ECR repos found in any selected region ($REQUESTED)"
            exit 1
          fi

          echo "regions=$AVAILABLE" >> $GITHUB_OUTPUT
          echo "skipped=${SKIPPED:-none}" >> $GITHUB_OUTPUT
          echo ""
          echo "Requested: $REQUESTED"
          echo "Available: $AVAILABLE"
          if [[ -n "$SKIPPED" ]]; then echo "Skipped:   $SKIPPED"; fi

      - name: Login to ECR (us-east-1)
        if: contains(steps.regions.outputs.regions, 'use1')
        run: |
          aws ecr get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Login to ECR (ca-central-1)
        if: contains(steps.regions.outputs.regions, 'cac1')
        run: |
          aws ecr get-login-password --region ca-central-1 | \
            docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ca-central-1.amazonaws.com

      - name: Login to ECR (ap-southeast-1)
        if: contains(steps.regions.outputs.regions, 'apse1')
        run: |
          aws ecr get-login-password --region ap-southeast-1 | \
            docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release-all.sh
        id: release
        env:
          SKIP_ECR_LOGIN: "true"
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS="--apps ${{ inputs.apps }} --regions ${{ steps.regions.outputs.regions }}"

          if [[ "${{ inputs.parallel }}" == "true" ]]; then
            ARGS="$ARGS --parallel"
          fi

          if [[ "${{ inputs.skip_bump }}" == "true" ]]; then
            ARGS="$ARGS --skip-bump"
          fi

          if [[ "${{ inputs.create_pr }}" == "true" ]]; then
            # Create PR but don't auto-merge (we'll do it separately with admin token)
            ARGS="$ARGS --pr --no-merge"
          else
            ARGS="$ARGS --push"
          fi

          echo "Running: ./apps/release-all.sh $ARGS"
          # Capture output to extract PR URL
          OUTPUT=$(./apps/release-all.sh $ARGS 2>&1 | tee /dev/stderr)

          # Extract PR URL from output
          PR_URL=$(echo "$OUTPUT" | grep -oE 'https://github.com/[^/]+/[^/]+/pull/[0-9]+' | head -1 || true)
          if [[ -n "$PR_URL" ]]; then
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi

      - name: Merge PR
        id: merge
        if: inputs.create_pr && steps.release.outputs.pr_number
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.release.outputs.pr_number }}"
          echo "Merging PR #${PR_NUMBER} with admin token..."

          if gh pr merge "$PR_NUMBER" --squash --delete-branch --admin; then
            echo "✅ PR #${PR_NUMBER} merged successfully"
            # Capture merge commit SHA so deploy jobs checkout the correct ref
            sleep 2
            MERGE_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit --jq '.mergeCommit.oid')
            echo "merge_sha=$MERGE_SHA" >> $GITHUB_OUTPUT
            echo "Merge SHA: $MERGE_SHA"
          else
            echo "⚠️ Auto-merge failed. PR may need manual merge."
            echo "PR: ${{ steps.release.outputs.pr_url }}"
          fi

      - name: Generate Summary
        if: always()
        run: |
          echo "## Build+Pub Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Apps:** ${{ inputs.apps }}" >> $GITHUB_STEP_SUMMARY
          echo "**Regions:** ${{ steps.regions.outputs.regions }}" >> $GITHUB_STEP_SUMMARY
          SKIPPED="${{ steps.regions.outputs.skipped }}"
          if [[ "$SKIPPED" != "none" ]]; then
            echo "**Skipped:** $SKIPPED (no ECR repos)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Runner:** Self-hosted EC2 (${{ inputs.ec2_instance_type }}, ${{ inputs.ec2_market_type }})" >> $GITHUB_STEP_SUMMARY
          echo "**Parallel:** ${{ inputs.parallel }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  # Run build on existing EC2 runner (reuse mode)
  build-ec2-existing:
    if: inputs.runner == 'ec2-reuse-existing'
    name: Build+Pub (Existing EC2)
    runs-on: dc34-release-runner  # Fixed label for persistent runner
    environment: ec2-runner
    timeout-minutes: 30

    outputs:
      merge_sha: ${{ steps.merge.outputs.merge_sha }}

    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/dc34-github-release
          aws-region: us-east-1

      - name: Discover available ECR regions
        id: regions
        run: |
          REQUESTED="${{ inputs.regions }}"
          AVAILABLE=""
          SKIPPED=""

          for code in $(echo "$REQUESTED" | tr ',' ' '); do
            case "$code" in
              use1)  aws_region="us-east-1" ;;
              cac1)  aws_region="ca-central-1" ;;
              apse1) aws_region="ap-southeast-1" ;;
              *)     continue ;;
            esac

            PROBE=$(aws ecr describe-repositories \
              --repository-names dc34-run-human-app \
              --region "$aws_region" 2>&1) && RC=0 || RC=$?

            if [[ $RC -eq 0 ]]; then
              AVAILABLE="${AVAILABLE:+$AVAILABLE,}$code"
              echo "✅ $code ($aws_region): ECR repos found"
            elif echo "$PROBE" | grep -q "RepositoryNotFoundException"; then
              SKIPPED="${SKIPPED:+$SKIPPED,}$code"
              echo "⏭️ $code ($aws_region): no ECR repos — skipping"
            else
              AVAILABLE="${AVAILABLE:+$AVAILABLE,}$code"
              echo "⚠️ $code ($aws_region): probe error, assuming available"
            fi
          done

          if [[ -z "$AVAILABLE" ]]; then
            echo "::error::No ECR repos found in any selected region ($REQUESTED)"
            exit 1
          fi

          echo "regions=$AVAILABLE" >> $GITHUB_OUTPUT
          echo "skipped=${SKIPPED:-none}" >> $GITHUB_OUTPUT
          echo ""
          echo "Requested: $REQUESTED"
          echo "Available: $AVAILABLE"
          if [[ -n "$SKIPPED" ]]; then echo "Skipped:   $SKIPPED"; fi

      - name: Login to ECR (us-east-1)
        if: contains(steps.regions.outputs.regions, 'use1')
        run: |
          aws ecr get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Login to ECR (ca-central-1)
        if: contains(steps.regions.outputs.regions, 'cac1')
        run: |
          aws ecr get-login-password --region ca-central-1 | \
            docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ca-central-1.amazonaws.com

      - name: Login to ECR (ap-southeast-1)
        if: contains(steps.regions.outputs.regions, 'apse1')
        run: |
          aws ecr get-login-password --region ap-southeast-1 | \
            docker login --username AWS --password-stdin ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run release-all.sh
        id: release
        env:
          SKIP_ECR_LOGIN: "true"
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS="--apps ${{ inputs.apps }} --regions ${{ steps.regions.outputs.regions }}"

          if [[ "${{ inputs.parallel }}" == "true" ]]; then
            ARGS="$ARGS --parallel"
          fi

          if [[ "${{ inputs.skip_bump }}" == "true" ]]; then
            ARGS="$ARGS --skip-bump"
          fi

          if [[ "${{ inputs.create_pr }}" == "true" ]]; then
            # Create PR but don't auto-merge (we'll do it separately with admin token)
            ARGS="$ARGS --pr --no-merge"
          else
            ARGS="$ARGS --push"
          fi

          echo "Running: ./apps/release-all.sh $ARGS"
          # Capture output to extract PR URL
          OUTPUT=$(./apps/release-all.sh $ARGS 2>&1 | tee /dev/stderr)

          # Extract PR URL from output
          PR_URL=$(echo "$OUTPUT" | grep -oE 'https://github.com/[^/]+/[^/]+/pull/[0-9]+' | head -1 || true)
          if [[ -n "$PR_URL" ]]; then
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi

      - name: Merge PR
        id: merge
        if: inputs.create_pr && steps.release.outputs.pr_number
        env:
          GH_TOKEN: ${{ secrets.GH_RUNNER_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.release.outputs.pr_number }}"
          echo "Merging PR #${PR_NUMBER} with admin token..."

          if gh pr merge "$PR_NUMBER" --squash --delete-branch --admin; then
            echo "✅ PR #${PR_NUMBER} merged successfully"
            # Capture merge commit SHA so deploy jobs checkout the correct ref
            sleep 2
            MERGE_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit --jq '.mergeCommit.oid')
            echo "merge_sha=$MERGE_SHA" >> $GITHUB_OUTPUT
            echo "Merge SHA: $MERGE_SHA"
          else
            echo "⚠️ Auto-merge failed. PR may need manual merge."
            echo "PR: ${{ steps.release.outputs.pr_url }}"
          fi

      - name: Generate Summary
        if: always()
        run: |
          echo "## Build+Pub Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Apps:** ${{ inputs.apps }}" >> $GITHUB_STEP_SUMMARY
          echo "**Regions:** ${{ steps.regions.outputs.regions }}" >> $GITHUB_STEP_SUMMARY
          SKIPPED="${{ steps.regions.outputs.skipped }}"
          if [[ "$SKIPPED" != "none" ]]; then
            echo "**Skipped:** $SKIPPED (no ECR repos)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Runner:** Existing EC2 (reused)" >> $GITHUB_STEP_SUMMARY
          echo "**Parallel:** ${{ inputs.parallel }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  # Stop EC2 runner (only for ephemeral mode)
  stop-ec2-runner:
    if: inputs.runner == 'ec2-ephemeral' && always()
    name: Stop EC2 Runner
    needs: [start-ec2-runner, build-ec2-new]
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/dc34-github-release
          aws-region: us-east-1

      - name: Stop EC2 Runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: stop
          github-token: ${{ secrets.GH_RUNNER_TOKEN }}
          label: ${{ needs.start-ec2-runner.outputs.runner-label }}
          ec2-instance-id: ${{ needs.start-ec2-runner.outputs.ec2-instance-id }}

  # ============================================================================
  # Optional: Deploy to ECS + invalidate cache after build
  #
  # Chains build → deploy so you can one-click the full pipeline.
  # Uses terragrunt-apply.yml as a reusable workflow (inherits its IAM role
  # trust policy via job_workflow_ref). One job per region, conditionally run.
  # ============================================================================
  deploy-use1:
    if: >-
      inputs.deploy && always() &&
      contains(inputs.regions, 'use1') &&
      (needs.build-github-hosted.result == 'success' ||
       needs.build-ec2-new.result == 'success' ||
       needs.build-ec2-existing.result == 'success')
    name: Deploy use1
    needs: [build-github-hosted, build-ec2-new, build-ec2-existing, stop-ec2-runner]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/terragrunt-apply.yml
    with:
      runner: github-hosted
      region: us-east-1
      modules: ecs-task,ecs-service
      ref: ${{ needs.build-github-hosted.outputs.merge_sha || needs.build-ec2-new.outputs.merge_sha || needs.build-ec2-existing.outputs.merge_sha || '' }}
    secrets: inherit

  deploy-cac1:
    if: >-
      inputs.deploy && always() &&
      contains(inputs.regions, 'cac1') &&
      (needs.build-github-hosted.result == 'success' ||
       needs.build-ec2-new.result == 'success' ||
       needs.build-ec2-existing.result == 'success')
    name: Deploy cac1
    needs: [build-github-hosted, build-ec2-new, build-ec2-existing, stop-ec2-runner]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/terragrunt-apply.yml
    with:
      runner: github-hosted
      region: ca-central-1
      modules: ecs-task,ecs-service
      ref: ${{ needs.build-github-hosted.outputs.merge_sha || needs.build-ec2-new.outputs.merge_sha || needs.build-ec2-existing.outputs.merge_sha || '' }}
    secrets: inherit

  deploy-apse1:
    if: >-
      inputs.deploy && always() &&
      contains(inputs.regions, 'apse1') &&
      (needs.build-github-hosted.result == 'success' ||
       needs.build-ec2-new.result == 'success' ||
       needs.build-ec2-existing.result == 'success')
    name: Deploy apse1
    needs: [build-github-hosted, build-ec2-new, build-ec2-existing, stop-ec2-runner]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/terragrunt-apply.yml
    with:
      runner: github-hosted
      region: ap-southeast-1
      modules: ecs-task,ecs-service
      ref: ${{ needs.build-github-hosted.outputs.merge_sha || needs.build-ec2-new.outputs.merge_sha || needs.build-ec2-existing.outputs.merge_sha || '' }}
    secrets: inherit

  invalidate-cache:
    if: >-
      inputs.deploy && always() &&
      (needs.deploy-use1.result == 'success' || needs.deploy-use1.result == 'skipped') &&
      (needs.deploy-cac1.result == 'success' || needs.deploy-cac1.result == 'skipped') &&
      (needs.deploy-apse1.result == 'success' || needs.deploy-apse1.result == 'skipped') &&
      (needs.deploy-use1.result == 'success' || needs.deploy-cac1.result == 'success' || needs.deploy-apse1.result == 'success')
    name: Invalidate Cache
    needs: [deploy-use1, deploy-cac1, deploy-apse1]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/dc34-github-deploy
          aws-region: us-east-1

      - name: Invalidate CloudFront Cache
        run: |
          echo "## CloudFront Invalidation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          declare -A DOMAINS=(
            ["run-auth"]="auth.defcon.run"
            ["run-human"]="run.defcon.run"
            ["run-cms"]="cms.defcon.run"
            ["run-gpx"]="gpx.defcon.run"
            ["run-flash"]="flash.defcon.run"
            ["run-bib"]="bib.defcon.run"
          )

          for APP in "${!DOMAINS[@]}"; do
            DOMAIN="${DOMAINS[$APP]}"

            DISTRIBUTION_ID=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?Aliases.Items[?@=='${DOMAIN}']].Id" \
              --output text 2>/dev/null || true)

            if [[ -n "$DISTRIBUTION_ID" && "$DISTRIBUTION_ID" != "None" ]]; then
              INVALIDATION_ID=$(aws cloudfront create-invalidation \
                --distribution-id "$DISTRIBUTION_ID" \
                --paths "/*" \
                --query 'Invalidation.Id' \
                --output text)
              echo "- **${DOMAIN}**: Invalidation \`${INVALIDATION_ID}\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **${DOMAIN}**: No distribution found" >> $GITHUB_STEP_SUMMARY
            fi
          done
