name: NPM Security Audit

on:
  # pull_request:
  #   paths:
  #     - 'apps/**/package.json'
  #     - 'apps/**/package-lock.json'
  # push:
  #   branches: [main]
  #   paths:
  #     - 'apps/**/package.json'
  #     - 'apps/**/package-lock.json'
  schedule:
    # Run weekly on Monday at 6am UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - run.auth/webapp
          - run.human/webapp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Run npm audit
        working-directory: apps/${{ matrix.app }}
        run: |
          echo "## NPM Audit Results for ${{ matrix.app }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run audit and capture output
          if npm audit --audit-level=high 2>&1 | tee audit-output.txt; then
            echo "✅ No high or critical vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Vulnerabilities found:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat audit-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Generate audit JSON report
        if: always()
        working-directory: apps/${{ matrix.app }}
        run: |
          npm audit --json > audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.app == 'run.auth/webapp' && 'run-auth' || 'run-human' }}
          path: apps/${{ matrix.app }}/audit-report.json
          retention-days: 30
