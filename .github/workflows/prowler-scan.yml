name: 🛡️ Prowler

on:
  # Run on demand
  workflow_dispatch:
    inputs:
      severity:
        description: 'Minimum severity to report'
        required: false
        default: 'medium'
        type: choice
        options:
          - critical
          - high
          - medium
          - low
          - informational
      services:
        description: 'Specific services to scan (comma-separated, empty for all configured)'
        required: false
        default: ''
        type: string
      regions:
        description: 'Regions to scan (space-separated, empty for all configured)'
        required: false
        default: ''
        type: string

  # Run weekly on Sunday at 2am UTC
  schedule:
    - cron: '0 2 * * 0'

jobs:
  prowler-scan:
    name: Prowler Security Scan
    runs-on: ubuntu-latest
    environment: terraform-plan
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      # Default regions - add new regions here as you deploy them
      # Can be overridden via workflow_dispatch input
      PROWLER_REGIONS: ${{ inputs.regions || vars.PROWLER_REGIONS || 'us-east-1 ca-central-1' }}
      # Default services to scan
      PROWLER_SERVICES: iam s3 dynamodb kms ecs ecr cloudfront elbv2 wafv2 acm cloudwatch ssm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/dc34-github-prowler
          aws-region: ${{ env.AWS_REGION }}

      - name: Create output directory
        run: |
          mkdir -p prowler-output
          # Prowler container runs as uid 1000, ensure it can write to the output directory
          chmod 777 prowler-output

      - name: Run Prowler Scan
        id: prowler
        run: |
          # Determine services to scan
          if [ -n "${{ inputs.services }}" ]; then
            SERVICES="${{ inputs.services }}"
          else
            SERVICES="$PROWLER_SERVICES"
          fi

          # Determine severity
          SEVERITY="${{ inputs.severity || 'medium' }}"

          echo "Running Prowler scan..."
          echo "Regions: $PROWLER_REGIONS"
          echo "Services: $SERVICES"
          echo "Severity: $SEVERITY"

          # Run prowler using Docker (faster than pip install)
          # Both config and mutelist are loaded from mounted .prowler directory
          # Muted findings will show as status=FAIL but muted=true in output
          docker run --rm \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -v "$(pwd)/.prowler:/home/prowler/.prowler:ro" \
            -v "$(pwd)/prowler-output:/home/prowler/output" \
            prowlercloud/prowler:5.16.1 \
            aws \
            --region $PROWLER_REGIONS \
            --service $SERVICES \
            --severity $SEVERITY \
            --config-file /home/prowler/.prowler/config.yaml \
            --mutelist-file /home/prowler/.prowler/allowlist.yaml \
            --output-formats json-ocsf html \
            --output-directory /home/prowler/output \
            --status FAIL MANUAL \
            || true  # Don't fail the workflow on findings

          # Count non-muted findings only (OCSF format)
          # status_id: 1=New, 2=Update, 3=Suppressed (muted)
          # status: "New", "Suppressed" (for muted findings)
          # OCSF files are arrays of findings at root level
          CRITICAL=$(jq '[.[] | select(.severity == "Critical" and .status != "Suppressed")] | length' prowler-output/*.ocsf.json 2>/dev/null || echo 0)
          HIGH=$(jq '[.[] | select(.severity == "High" and .status != "Suppressed")] | length' prowler-output/*.ocsf.json 2>/dev/null || echo 0)
          MEDIUM=$(jq '[.[] | select(.severity == "Medium" and .status != "Suppressed")] | length' prowler-output/*.ocsf.json 2>/dev/null || echo 0)
          MUTED=$(jq '[.[] | select(.status == "Suppressed")] | length' prowler-output/*.ocsf.json 2>/dev/null || echo 0)

          # Ensure we have valid numbers (default to 0 if empty)
          CRITICAL=${CRITICAL:-0}
          HIGH=${HIGH:-0}
          MEDIUM=${MEDIUM:-0}
          MUTED=${MUTED:-0}

          echo "critical_count=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high_count=$HIGH" >> $GITHUB_OUTPUT
          echo "medium_count=$MEDIUM" >> $GITHUB_OUTPUT
          echo "muted_count=$MUTED" >> $GITHUB_OUTPUT

      - name: Upload Prowler Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prowler-results-${{ github.run_number }}
          path: prowler-output/
          retention-days: 14

      - name: Write Job Summary
        if: always()
        run: |
          echo "## Prowler Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Regions:** $PROWLER_REGIONS" >> $GITHUB_STEP_SUMMARY
          echo "**Severity Filter:** ${{ inputs.severity || 'medium' }}+" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Findings Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | ${{ steps.prowler.outputs.critical_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| High | ${{ steps.prowler.outputs.high_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Medium | ${{ steps.prowler.outputs.medium_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Muted | ${{ steps.prowler.outputs.muted_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full results are available in the uploaded artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Fail on Critical Findings
        if: steps.prowler.outputs.critical_count != '0'
        run: |
          echo "::error::Found ${{ steps.prowler.outputs.critical_count }} critical security findings!"
          exit 1
