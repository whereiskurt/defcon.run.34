name: Terragrunt Plan

on:
  workflow_dispatch:

jobs:
  plan:
    name: Terragrunt Plan
    runs-on: ubuntu-latest
    environment: terraform-plan
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    env:
      AWS_REGION: us-east-1
      TG_BUCKET_USE1: tf-defcon-run-use1-${{ vars.SGUID }}
      TG_TABLE_USE1: tf-defcon-run-use1-${{ vars.SGUID }}
      TG_BUCKET_CAC1: tf-defcon-run-cac1-${{ vars.SGUID }}
      TG_TABLE_CAC1: tf-defcon-run-cac1-${{ vars.SGUID }}
      SGUID: ${{ vars.SGUID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Terragrunt and SOPS
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/terragrunt
            /usr/local/bin/sops
          key: tools-${{ runner.os }}-terragrunt-v0.77.10-sops-v3.9.4

      - name: Cache Terragrunt Provider Cache
        uses: actions/cache@v4
        with:
          path: ~/.terragrunt-cache
          key: terragrunt-providers-${{ runner.os }}-${{ hashFiles('infra/terraform/**/*.tf') }}
          restore-keys: |
            terragrunt-providers-${{ runner.os }}-

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/dc34-github-readonly
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          if [ ! -f /usr/local/bin/terragrunt ]; then
            curl -Lo /usr/local/bin/terragrunt \
              "https://github.com/gruntwork-io/terragrunt/releases/download/v0.77.10/terragrunt_linux_amd64"
            chmod +x /usr/local/bin/terragrunt
          fi
          terragrunt --version

      - name: Setup SOPS
        run: |
          if [ ! -f /usr/local/bin/sops ]; then
            curl -Lo /usr/local/bin/sops \
              "https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64"
            chmod +x /usr/local/bin/sops
          fi
          sops --version

      - name: Terragrunt Plan
        id: plan
        working-directory: infra/terraform/live/site
        env:
          TERRAGRUNT_PROVIDER_CACHE: "1"
        run: |
          # Run plan and capture output
          terragrunt run-all plan -no-color 2>&1 | tee plan_output.txt

          # Check exit code
          exit_code=${PIPESTATUS[0]}

          # Truncate if too long for PR comment (max ~65k chars)
          if [ $(wc -c < plan_output.txt) -gt 60000 ]; then
            echo "Plan output truncated (too large for PR comment)" > plan_summary.txt
            head -c 30000 plan_output.txt >> plan_summary.txt
            echo -e "\n\n... (truncated) ...\n\n" >> plan_summary.txt
            tail -c 30000 plan_output.txt >> plan_summary.txt
          else
            cp plan_output.txt plan_summary.txt
          fi

          exit $exit_code
        continue-on-error: true

      - name: Upload Plan Output
        uses: actions/upload-artifact@v4
        with:
          name: terragrunt-plan
          path: infra/terraform/live/site/plan_output.txt
          retention-days: 14

      - name: Write Job Summary
        run: |
          STATUS=$([[ "${{ steps.plan.outcome }}" == "success" ]] && echo "✅" || echo "❌")
          echo "## ${STATUS} Terragrunt Plan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>Click to expand plan output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```hcl' >> $GITHUB_STEP_SUMMARY
          cat infra/terraform/live/site/plan_summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Plan generated from commit ${{ github.sha }}*" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('infra/terraform/live/site/plan_summary.txt', 'utf8');
            const planExitCode = '${{ steps.plan.outcome }}';

            const status = planExitCode === 'success' ? '✅' : '❌';
            const body = `## ${status} Terragrunt Plan

            <details>
            <summary>Click to expand plan output</summary>

            \`\`\`hcl
            ${planOutput}
            \`\`\`

            </details>

            *Plan generated from commit ${{ github.sha }}*
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Terragrunt Plan')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
