name: "🏗️ Infra: Terragrunt Apply"

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner type'
        type: choice
        options:
          - github-hosted
          - ec2-reuse-existing
        default: github-hosted
      region:
        description: 'Target region (empty = all)'
        type: choice
        options:
          - ''
          - us-east-1
          - ca-central-1
        default: ''
      modules:
        description: 'Modules to apply (comma-separated, empty = all)'
        type: string
        default: ''

  # Called by other workflows (e.g., deploy.yml)
  workflow_call:
    inputs:
      runner:
        description: 'Runner type (github-hosted or ec2-reuse-existing)'
        type: string
        default: 'github-hosted'
      region:
        description: 'Target region (empty = all)'
        type: string
        default: ''
      modules:
        description: 'Modules to apply (comma-separated, e.g., ecs-task,ecs-service)'
        type: string
        default: ''

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Terragrunt Apply
    # Use EC2 runner if selected, otherwise github-hosted
    runs-on: ${{ inputs.runner == 'ec2-reuse-existing' && 'dc34-release-runner' || 'ubuntu-latest' }}
    environment: terraform-apply
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      TG_BUCKET_USE1: tf-defcon-run-use1-${{ vars.SGUID }}
      TG_TABLE_USE1: tf-defcon-run-use1-${{ vars.SGUID }}
      TG_BUCKET_CAC1: tf-defcon-run-cac1-${{ vars.SGUID }}
      TG_TABLE_CAC1: tf-defcon-run-cac1-${{ vars.SGUID }}
      SGUID: ${{ vars.SGUID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Terragrunt and SOPS
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/terragrunt
            /usr/local/bin/sops
          key: tools-${{ runner.os }}-terragrunt-v0.97.1-sops-v3.11.0

      - name: Cache Terragrunt Provider Cache
        uses: actions/cache@v4
        with:
          path: ~/.terragrunt-cache
          key: terragrunt-providers-${{ runner.os }}-${{ hashFiles('infra/terraform/**/*.tf') }}
          restore-keys: |
            terragrunt-providers-${{ runner.os }}-

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/dc34-github-terragrunt
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          if [ ! -f /usr/local/bin/terragrunt ]; then
            curl -Lo /usr/local/bin/terragrunt \
              "https://github.com/gruntwork-io/terragrunt/releases/download/v0.97.1/terragrunt_linux_amd64"
            chmod +x /usr/local/bin/terragrunt
          fi
          terragrunt --version

      - name: Setup SOPS
        run: |
          if [ ! -f /usr/local/bin/sops ]; then
            curl -Lo /usr/local/bin/sops \
              "https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64"
            chmod +x /usr/local/bin/sops
          fi
          sops --version

      - name: Terragrunt Apply
        id: apply
        working-directory: infra/terraform/live/site
        env:
          TG_PROVIDER_CACHE: "1"
        run: |
          REGION="${{ inputs.region }}"
          MODULES="${{ inputs.modules }}"

          # If specific region and modules, apply to each module directory
          if [[ -n "$REGION" && -n "$MODULES" ]]; then
            echo "Applying modules [$MODULES] in region [$REGION]..."
            IFS=',' read -ra MODULE_LIST <<< "$MODULES"
            for MODULE in "${MODULE_LIST[@]}"; do
              MODULE=$(echo "$MODULE" | xargs)  # trim whitespace
              echo "=== Applying $MODULE in $REGION ==="
              (cd "region/$REGION/$MODULE" && terragrunt apply --no-color --non-interactive -auto-approve) 2>&1 | tee -a apply_output.txt
            done
          # If only region specified, apply all in that region
          elif [[ -n "$REGION" ]]; then
            echo "Applying all modules in region [$REGION]..."
            (cd "region/$REGION" && terragrunt run apply --all --no-color --non-interactive -- -auto-approve) 2>&1 | tee apply_output.txt
          # Otherwise apply everything
          else
            echo "Applying all modules in all regions..."
            terragrunt run apply --all --no-color --non-interactive -- -auto-approve 2>&1 | tee apply_output.txt
          fi
          exit_code=${PIPESTATUS[0]}

          # Truncate if too long for summary (max ~65k chars)
          if [ $(wc -c < apply_output.txt) -gt 60000 ]; then
            echo "Apply output truncated (too large for summary)" > apply_summary.txt
            head -c 30000 apply_output.txt >> apply_summary.txt
            echo -e "\n\n... (truncated) ...\n\n" >> apply_summary.txt
            tail -c 30000 apply_output.txt >> apply_summary.txt
          else
            cp apply_output.txt apply_summary.txt
          fi

          exit $exit_code
        continue-on-error: true

      - name: Upload Apply Output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terragrunt-apply
          path: infra/terraform/live/site/apply_output.txt
          retention-days: 14

      - name: Write Job Summary
        if: always()
        run: |
          # Determine final status (check retries when enabled)
          # When retries are enabled, update this to check all retry steps:
          FINAL_OUTCOME="${{ steps.apply.outcome }}"

          STATUS=$([[ "$FINAL_OUTCOME" == "success" ]] && echo "✅" || echo "❌")
          echo "## ${STATUS} Terragrunt Apply" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Runner:** ${{ inputs.runner == 'ec2-reuse-existing' && '🖥️ EC2 (dc34-release-runner)' || '☁️ GitHub-hosted' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>Click to expand apply output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```hcl' >> $GITHUB_STEP_SUMMARY
          cat infra/terraform/live/site/apply_summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Fail if apply failed
        run: |
          # When retries are enabled, update this condition:
          if [[ "${{ steps.apply.outcome }}" == "failure" ]]; then
            echo "::error::Terragrunt apply failed"
            exit 1
          fi
