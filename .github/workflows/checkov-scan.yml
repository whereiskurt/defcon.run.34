name: "🛡️ Security: Checkov"

on:
  # pull_request:
  #   paths:
  #     - 'infra/terraform/**'
  # push:
  #   branches: [main]
  #   paths:
  #     - 'infra/terraform/**'
  workflow_dispatch:

jobs:
  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@1f0ef821c5e4e9c5c9ae9550701402d75c9608b5 # v12
        with:
          directory: infra/terraform/
          framework: terraform
          output_format: cli,json
          output_file_path: console,checkov-results.json
          soft_fail: true
          download_external_modules: true
          # Skipped checks with rationale:
          # CKV_TF_1, CKV_TF_2: Module source pinning (using local modules)
          # CKV_AWS_374: CloudFront geo-restriction (DEF CON attendees are global)
          # CKV_AWS_117: Lambda VPC config (email forwarder only needs SES/S3)
          # CKV_AWS_116: Lambda DLQ (CloudWatch logs sufficient for debugging)
          # CKV_AWS_144: S3 cross-region replication (future: centralized logging account)
          # CKV2_AWS_6: S3 public access block (some buckets need CloudFront access)
          # CKV_AWS_18: S3 access logging (not needed for all buckets)
          # CKV2_AWS_34: SSM String params for non-sensitive config (bucket names, ARNs, queries)
          skip_check: CKV_TF_1,CKV_TF_2,CKV_AWS_374,CKV_AWS_117,CKV_AWS_116,CKV_AWS_144,CKV_AWS_18,CKV2_AWS_34

      - name: Generate Summary Report
        if: always()
        run: |
          echo "## Checkov IaC Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Directory:** \`infra/terraform/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f checkov-results.json ]; then
            echo "⚠️ No results file found" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Count results by status
          PASSED=$(jq '[.results.passed_checks // [] | length] | add // 0' checkov-results.json)
          FAILED=$(jq '[.results.failed_checks // [] | length] | add // 0' checkov-results.json)
          SKIPPED=$(jq '[.results.skipped_checks // [] | length] | add // 0' checkov-results.json)

          # Count failed checks by severity
          CRITICAL=$(jq '[.results.failed_checks // [] | .[] | select(.severity == "CRITICAL")] | length' checkov-results.json)
          HIGH=$(jq '[.results.failed_checks // [] | .[] | select(.severity == "HIGH")] | length' checkov-results.json)
          MEDIUM=$(jq '[.results.failed_checks // [] | .[] | select(.severity == "MEDIUM")] | length' checkov-results.json)
          LOW=$(jq '[.results.failed_checks // [] | .[] | select(.severity == "LOW")] | length' checkov-results.json)
          # Count checks without severity (when not using Bridgecrew API)
          UNKNOWN=$(jq '[.results.failed_checks // [] | .[] | select(.severity == null or .severity == "")] | length' checkov-results.json)

          echo "### Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Only show severity breakdown if there are failures
          if [ "$FAILED" -gt 0 ]; then
            echo "### Failed Checks by Severity" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 High | $HIGH |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Medium | $MEDIUM |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟢 Low | $LOW |" >> $GITHUB_STEP_SUMMARY
            if [ "$UNKNOWN" -gt 0 ]; then
              echo "| ⚪ Unknown | $UNKNOWN |" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "### ❌ Failed Check Details" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Process each failed check, sorted by severity
            jq -r '.results.failed_checks // [] | sort_by(.severity | if . == "CRITICAL" then 0 elif . == "HIGH" then 1 elif . == "MEDIUM" then 2 elif . == "LOW" then 3 else 4 end) | .[] | @base64' checkov-results.json | while read -r item; do
              _jq() {
                echo "$item" | base64 --decode | jq -r "${1}"
              }

              CHECK_ID=$(_jq '.check_id')
              CHECK_NAME=$(_jq '.check_name // .check_id')
              RESOURCE=$(_jq '.resource')
              FILE=$(_jq '.file_path')
              LINE_START=$(_jq '.file_line_range[0] // "?"')
              LINE_END=$(_jq '.file_line_range[1] // "?"')
              GUIDELINE=$(_jq '.guideline // ""')
              BC_ID=$(_jq '.bc_check_id // ""')
              SEVERITY=$(_jq '.severity // "UNKNOWN"')

              # Set severity emoji
              case "$SEVERITY" in
                CRITICAL) EMOJI="🔴" ;;
                HIGH) EMOJI="🟠" ;;
                MEDIUM) EMOJI="🟡" ;;
                LOW) EMOJI="🟢" ;;
                *) EMOJI="⚪" ; SEVERITY="Unknown" ;;
              esac

              echo "<details>" >> $GITHUB_STEP_SUMMARY
              echo "<summary>$EMOJI <strong>$CHECK_ID</strong>: $CHECK_NAME</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
              echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
              echo "| **Severity** | $SEVERITY |" >> $GITHUB_STEP_SUMMARY
              echo "| **Resource** | \`$RESOURCE\` |" >> $GITHUB_STEP_SUMMARY
              echo "| **File** | \`$FILE\` |" >> $GITHUB_STEP_SUMMARY
              echo "| **Lines** | $LINE_START - $LINE_END |" >> $GITHUB_STEP_SUMMARY

              if [ -n "$BC_ID" ] && [ "$BC_ID" != "null" ] && [ "$BC_ID" != "" ]; then
                echo "| **Bridgecrew ID** | $BC_ID |" >> $GITHUB_STEP_SUMMARY
              fi

              if [ -n "$GUIDELINE" ] && [ "$GUIDELINE" != "null" ] && [ "$GUIDELINE" != "" ]; then
                echo "| **Guide** | [Documentation]($GUIDELINE) |" >> $GITHUB_STEP_SUMMARY
              fi

              echo "" >> $GITHUB_STEP_SUMMARY

              # Extract and display code snippet
              CODE_BLOCK=$(_jq '.code_block // null')
              if [ "$CODE_BLOCK" != "null" ] && [ -n "$CODE_BLOCK" ]; then
                echo "**Code:**" >> $GITHUB_STEP_SUMMARY
                echo "\`\`\`hcl" >> $GITHUB_STEP_SUMMARY
                echo "$item" | base64 --decode | jq -r '.code_block | if type == "array" then .[] | .[1] else . end' >> $GITHUB_STEP_SUMMARY
                echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              fi

              echo "" >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            done
          fi

          # Store counts for later steps
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT

      - name: Upload Checkov Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-results-${{ github.run_number }}
          path: checkov-results.json
          retention-days: 14
