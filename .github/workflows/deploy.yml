name: "🚀 Deploy: Release"

run-name: "Deploy all apps"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR to merge: "latest", PR number, or "skip" to deploy without merge'
        type: string
        default: 'latest'
      invalidate_cache:
        description: 'Invalidate CloudFront cache after deploy'
        type: boolean
        default: true

env:
  TF_SITE_DIR: infra/terraform/live/site

jobs:
  # ============================================================================
  # Optional: Merge PR before deploy
  # ============================================================================
  merge-pr:
    if: inputs.pr_number != '' && inputs.pr_number != 'skip'
    name: Merge Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write
      pull-requests: write

    outputs:
      merge_sha: ${{ steps.merge.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and Merge PR
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## PR Merge" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          PR_INPUT="${{ inputs.pr_number }}"

          # Handle "latest" - find most recent open release PR with "Release" in title
          if [[ "$PR_INPUT" == "latest" ]]; then
            echo "Finding latest open release PR..."
            PR_NUMBER=$(gh pr list --state open --json number,title,headRefName,createdAt \
              --jq '[.[] | select(.title | startswith("Release"))] | sort_by(.createdAt) | reverse | .[0].number')

            if [[ -z "$PR_NUMBER" || "$PR_NUMBER" == "null" ]]; then
              echo "::error::No open release PRs found"
              echo "**Error:** No open Release PRs found" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Open PRs (looking for title starting with 'Release'):" >> $GITHUB_STEP_SUMMARY
              gh pr list --state open --json number,title,headRefName --jq '.[] | "- #\(.number): \(.title)"' >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
            echo "Found latest release PR: #$PR_NUMBER"
          else
            PR_NUMBER="$PR_INPUT"
          fi

          # Get PR details
          PR_INFO=$(gh pr view $PR_NUMBER --json title,state,headRefName,baseRefName,mergeable)
          PR_TITLE=$(echo "$PR_INFO" | jq -r '.title')
          PR_STATE=$(echo "$PR_INFO" | jq -r '.state')
          PR_HEAD=$(echo "$PR_INFO" | jq -r '.headRefName')
          PR_BASE=$(echo "$PR_INFO" | jq -r '.baseRefName')
          MERGEABLE=$(echo "$PR_INFO" | jq -r '.mergeable')

          echo "**PR #${PR_NUMBER}:** $PR_TITLE" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** $PR_HEAD → $PR_BASE" >> $GITHUB_STEP_SUMMARY
          echo "**State:** $PR_STATE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "$PR_STATE" != "OPEN" ]]; then
            echo "::error::PR #${PR_NUMBER} is not open (state: $PR_STATE)"
            exit 1
          fi

          if [[ "$MERGEABLE" != "MERGEABLE" ]]; then
            echo "::warning::PR may have merge conflicts (mergeable: $MERGEABLE)"
          fi

          # Approve and merge the PR
          echo "Approving PR..."
          gh pr review $PR_NUMBER --approve --body "Auto-approved by deploy workflow" || true

          echo "Merging PR..."
          gh pr merge $PR_NUMBER --squash --delete-branch

          # Get the merge commit SHA
          sleep 2
          MERGE_SHA=$(gh pr view $PR_NUMBER --json mergeCommit --jq '.mergeCommit.oid')
          echo "sha=$MERGE_SHA" >> $GITHUB_OUTPUT

          echo "**Merged:** ✅" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`$MERGE_SHA\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Deploy to ECS
  # ============================================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [merge-pr]
    if: always() && (needs.merge-pr.result == 'success' || needs.merge-pr.result == 'skipped')

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.merge-pr.outputs.merge_sha || github.ref }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/dc34-github-deploy
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sL https://github.com/gruntwork-io/terragrunt/releases/download/v0.68.0/terragrunt_linux_amd64 -o terragrunt
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/
          terragrunt --version

      - name: Show current versions
        run: |
          echo "## Current Versions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|---------|" >> $GITHUB_STEP_SUMMARY

          for app in run-auth run-human run-cms run-gpx; do
            VERSION=$(cat ${{ env.TF_SITE_DIR }}/services/${app}/VERSION.app 2>/dev/null || echo "N/A")
            echo "| ${app} | ${VERSION} |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Deploy ECS Tasks and Services
        working-directory: ${{ env.TF_SITE_DIR }}
        run: |
          echo "Deploying all regions..."
          terragrunt run apply --all --non-interactive -- -auto-approve

      - name: Invalidate CloudFront Cache
        if: inputs.invalidate_cache
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## CloudFront Invalidation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Map apps to CloudFront domains
          declare -A DOMAINS=(
            ["run-auth"]="auth.defcon.run"
            ["run-human"]="run.defcon.run"
            ["run-cms"]="cms.defcon.run"
            ["run-gpx"]="gpx.defcon.run"
          )

          for APP in "${!DOMAINS[@]}"; do
            DOMAIN="${DOMAINS[$APP]}"

            DISTRIBUTION_ID=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?Aliases.Items[?@=='${DOMAIN}']].Id" \
              --output text 2>/dev/null || true)

            if [[ -n "$DISTRIBUTION_ID" && "$DISTRIBUTION_ID" != "None" ]]; then
              INVALIDATION_ID=$(aws cloudfront create-invalidation \
                --distribution-id "$DISTRIBUTION_ID" \
                --paths "/*" \
                --query 'Invalidation.Id' \
                --output text)
              echo "- **${DOMAIN}**: Invalidation \`${INVALIDATION_ID}\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "- **${DOMAIN}**: No distribution found" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Generate Summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cache Invalidated:** ${{ inputs.invalidate_cache }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
