events {
  worker_connections 1024;
}

http {
  server_tokens off;

  # Auth-heavy users carry >8k of *.defcon.run cookies (nginx default
  # large_client_header_buffers 4 8k rejects those with a bare 400).
  large_client_header_buffers 4 16k;

  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  set_real_ip_from 0.0.0.0/0;
  
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  include       mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  upstream node_app {
    server localhost:3000;
  }

  map $host $target_upstream {
    default   http://node_app;
    ~webapp   http://node_app;
  }

  map $host $custom_header_value {
    default   "Default-App";
    ~webapp   "Web-App";
  }

  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    location /hello {
      default_type "text/html";
      add_header x-health-check alive-canary-0002;
      add_header x-release-version v0.0.1;
      add_header x-app-identifier HealthCheck;
      return 200 '<html><head><title>Hello (v0.0.1)</title></head><body><h1>Hello, World !</h1></body></html>';
    }

    # Hunt paths live OUTSIDE the app's /use1 basePath; standalone Next 404s
    # them before middleware ever runs, so the bridge lives here. The apex CDN
    # serves the actual redirect objects (landing bucket /qr/ keys).
    location /qr/ {
      return 302 https://defcon.run$request_uri;
    }

    location / {
      proxy_pass $target_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_cache_bypass $http_upgrade;

      add_header x-app-identifier $custom_header_value;
      add_header x-release-version v0.0.1;
    }

  }
}