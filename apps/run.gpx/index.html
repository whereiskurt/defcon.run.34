<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEF CON 34 Maps — gpx.defcon.run</title>

    <!-- Unfurl card (same og.* block as the b./f. vanity interstitials).
         Crawlers read these; humans are redirected client-side below.
         gpx-card.png ships in webapp/public/ and is served from the
         use1/assets/public S3 prefix (uploaded by apps/build.sh). -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="defcon.run">
    <meta property="og:url" content="https://gpx.defcon.run/">
    <meta property="og:title" content="DEF CON 34 Maps — Run the Routes">
    <meta property="og:description" content="Official DEF CON 34 running routes on a 3D Vegas map. Download the GPX, chase the rabbits, mind the ghosts.">
    <meta property="og:image" content="https://gpx.defcon.run/use1/assets/public/gpx-card.png">
    <meta property="og:image:secure_url" content="https://gpx.defcon.run/use1/assets/public/gpx-card.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="DEF CON 34 Maps — Run the Routes">
    <meta name="twitter:description" content="Official DEF CON 34 running routes on a 3D Vegas map. Download the GPX, chase the rabbits, mind the ghosts.">
    <meta name="twitter:image" content="https://gpx.defcon.run/use1/assets/public/gpx-card.png">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            color: #00ff00;
            font-family: 'Courier New', monospace;
        }
        .container {
            text-align: center;
        }
        .loading {
            font-size: 1.2rem;
        }
        .region-info {
            margin-top: 1rem;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
    <script>
        (function() {
            var COOKIE_NAME = 'preferred-region';
            var DEFAULT_REGION = 'use1';
            var VALID_REGIONS = ['use1', 'cac1', 'apse1'];

            function getCookie(name) {
                var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
                return match ? match[2] : null;
            }

            function redirect(region) {
                window.location.replace('/' + region + '/');
            }

            var preferred = getCookie(COOKIE_NAME);

            if (preferred && VALID_REGIONS.indexOf(preferred) !== -1) {
                redirect(preferred);
            } else {
                redirect(DEFAULT_REGION);
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <div class="loading">Redirecting to your region...</div>
        <div class="region-info">If you are not redirected, <a href="/use1/" style="color: #00ff00;">click here</a>.</div>
    </div>
</body>
</html>
