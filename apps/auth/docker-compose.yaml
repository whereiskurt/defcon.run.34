name: auth-defcon-run-local

services:
  
  auth-nginx:
    container_name: auth-nginx-defcon-run
    build:
      context: ./nginx/
      dockerfile: Dockerfile.nginx
    ports:
      - "443:443"
      - "3000:3000"
      - "8989:8000"
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "-A", "HealthChecker", "https://localhost/"]
      interval: 60s
      timeout: 5s
      retries: 3

  auth-app:
    container_name: auth-app-defcon-run
    network_mode: "service:auth-nginx"
    depends_on:
      dynamodb-local:
        condition: service_healthy
    build:
      context: ./webapp
      dockerfile: Dockerfile.webapp.dev
    
    env_file:
      - ./webapp/.env.development
    environment:
      - HOSTNAME=0.0.0.0
      - NODE_ENV=development
      - NEXTAUTH_URL=https://localhost
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    command: 
      - npm
      - run
      - dev
      
  dynamodb-local:
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    image: "amazon/dynamodb-local:latest"
    container_name: dynamodb-local
    network_mode: "service:auth-nginx"
    working_dir: /home/dynamodblocal
    healthcheck:
      test: ["CMD-SHELL", "curl -s -A 'HealthChecker' http://localhost:8000 || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 1

  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: dynamodb-init
    network_mode: "service:auth-nginx"
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./dynamo-local/init-local-db.sh:/init-local-db.sh:ro
    entrypoint: ["/bin/bash", "/init-local-db.sh"]


    # command: 
    #   - npm
    #   - run
    #   - dev