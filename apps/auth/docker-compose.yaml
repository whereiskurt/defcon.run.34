name: auth-defcon-run-local

services:
  
  auth-nginx:
    container_name: auth-nginx-defcon-run
    build:
      context: ./nginx/
      dockerfile: Dockerfile.nginx
    ports:
      - "443:443"
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "-A", "HealthChecker", "https://localhost/"]
      interval: 60s
      timeout: 5s
      retries: 3

  auth-app:
    container_name: auth-app-defcon-run
    network_mode: "service:auth-nginx"
    depends_on:
      dynamodb-local:
        condition: service_healthy
    build:
      context: ./webapp
      dockerfile: Dockerfile.webapp
    environment:
      - HOSTNAME=0.0.0.0
      - NEXTAUTH_URL=http://localhost:3000
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - AUTH_DYNAMODB_ENDPOINT=${AUTH_DYNAMODB_ENDPOINT:-http://localhost:8000}
      - AUTH_DYNAMODB_ID=${AUTH_DYNAMODB_ID:-}
      - AUTH_DYNAMODB_SECRET=${AUTH_DYNAMODB_SECRET:-}
      - AUTH_DYNAMODB_REGION=${AUTH_DYNAMODB_REGION:-}
      - AUTH_DYNAMODB_DBNAME=${AUTH_DYNAMODB_DBNAME:-}
      - AUTH_SES_ACCESS_KEY_ID=${AUTH_SES_ACCESS_KEY_ID:-}
      - AUTH_SES_SECRET_ACCESS_KEY=${AUTH_SES_SECRET_ACCESS_KEY:-}
      - AUTH_SES_REGION=${AUTH_SES_REGION:-}
      - AUTH_SES_SMTP_FROM=${AUTH_SES_SMTP_FROM:-}
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID:-}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET:-}
      - AUTH_STRAVA_CLIENT_ID=${AUTH_STRAVA_CLIENT_ID:-}
      - AUTH_STRAVA_CLIENT_SECRET=${AUTH_STRAVA_CLIENT_SECRET:-}
      - AUTH_DISCORD_CLIENT_ID=${AUTH_DISCORD_CLIENT_ID:-}
      - AUTH_DISCORD_CLIENT_SECRET=${AUTH_DISCORD_CLIENT_SECRET:-}
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-}
      - AUTH_ALLOWED_EMAILS=${AUTH_ALLOWED_EMAILS:-}

    command: 
      - node
      - server.js
      
  dynamodb-local:
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    image: "amazon/dynamodb-local:latest"
    container_name: dynamodb-local
    ports:
      - "8989:8000"
    working_dir: /home/dynamodblocal
    healthcheck:
      test: ["CMD-SHELL", "curl -s -A 'HealthChecker' http://localhost:8000 || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 1

  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: dynamodb-init
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./dynamo-local/init-local-db.sh:/init-local-db.sh:ro
    entrypoint: ["/bin/bash", "/init-local-db.sh"]


    # command: 
    #   - npm
    #   - run
    #   - dev