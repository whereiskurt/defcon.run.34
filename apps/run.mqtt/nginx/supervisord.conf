[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:meshobserv]
# `nodeinfo announce` is the meshmap collector: connects to the broker, subscribes
# to the mesh topics, collects observed NodeInfo/Position into the node DB, and
# writes it to NodeDbPath (/var/www/html/nodes.json) every 5s for nginx to serve.
# (The old `server inspect` command was renamed away and no longer exists — it just
# printed help and exited, so nodes.json was never written.)
# Two things are REQUIRED here:
#  1. `-c /app/meshtk.yaml`: supervisord runs this with cwd=/ , so without an
#     explicit config path meshtk can't find ./meshtk.yaml, falls back to defaults,
#     and writes to /nodes.default.json instead of the NodeDbPath nginx serves.
#  2. `</dev/null`: meshtk's config loader does io.ReadAll(os.Stdin) when stdin is
#     not a TTY. supervisord attaches an open stdin pipe that never EOFs, so the
#     process blocks forever on the stdin read and never reaches the collect loop.
#     Redirecting stdin from /dev/null (EOF) lets it proceed.
command=sh -c "exec /usr/local/bin/meshobserv -c /app/meshtk.yaml nodeinfo announce </dev/null"
autostart=true
autorestart=true
priority=20
startretries=10
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
