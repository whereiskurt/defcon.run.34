worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Auth-heavy users carry >8k of *.defcon.run cookies (nginx default
    # large_client_header_buffers 4 8k rejects those with a bare 400).
    large_client_header_buffers 4 16k;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types application/json text/html text/css application/javascript;

    server {
        listen 80;
        server_name _;

        root /var/www/html;
        index index.html;

        # Serve meshmap static files
        location / {
            try_files $uri $uri/ /index.html;
        }

        # nodes.json is written by meshobserv every 10 seconds
        # Disable caching so browsers always get fresh data
        location /nodes.json {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            # CORS for meshmap polling
            add_header Access-Control-Allow-Origin "*";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
}
