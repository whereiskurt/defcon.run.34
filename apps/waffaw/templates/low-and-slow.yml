config:
  target: "{{ $processEnvironment.TARGET_URL }}"
  phases:
    - duration: 28800  # 8 hours
      arrivalRate: 1   # 1 virtual user per second
      name: "Sustained low-rate traffic"
  engines:
    playwright:
      testIdAttribute: "data-testid"
      launchOptions:
        headless: true
        args:
          - "--no-sandbox"
          - "--disable-dev-shm-usage"
  processor: "../scenarios/index.ts"
  plugins:
    waffaw-logger:
      logLevel: "{{ $processEnvironment.LOG_LEVEL }}"
  payload:
    - path: "../data/pages.csv"
      fields:
        - "path"
      order: random

scenarios:
  - name: "Browse public pages"
    engine: playwright
    flowFunction: "browsePublic"
    flow: []
  - name: "Click around"
    engine: playwright
    flowFunction: "clickElement"
    flow: []
  - name: "Login and browse"
    engine: playwright
    flowFunction: "login"
    flow: []
