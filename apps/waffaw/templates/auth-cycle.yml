config:
  target: "{{ $processEnvironment.TARGET_URL }}"
  phases:
    - duration: 3600   # 1 hour
      arrivalRate: 0.2  # 1 VU every 5 seconds (slow cycle)
      name: "Auth cycle — login/browse/logout"
  engines:
    playwright:
      testIdAttribute: "data-testid"
      launchOptions:
        headless: true
        args:
          - "--no-sandbox"
          - "--disable-dev-shm-usage"
  processor: "../scenarios/index.ts"
  plugins:
    ./plugins/waffaw-logger:
      logLevel: "{{ $processEnvironment.LOG_LEVEL }}"
  payload:
    - path: "../data/users.csv"
      fields:
        - "username"
        - "password"
      order: random

scenarios:
  - name: "Valid login cycle"
    engine: playwright
    weight: 8
    flowFunction: "login"
    flow: []
  - name: "Browse after login"
    engine: playwright
    weight: 6
    flowFunction: "browsePublic"
    flow: []
  - name: "Logout"
    engine: playwright
    weight: 4
    flowFunction: "logout"
    flow: []
  - name: "Invalid login attempt"
    engine: playwright
    weight: 2
    flowFunction: "login"
    flow: []
