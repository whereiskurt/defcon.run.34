<!doctype html>
<html lang="en" class="{{THEME_DEFAULT}}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>{{META_TITLE}}</title>
<meta name="description" content="{{META_DESC}}" />
<meta name="theme-color" content="{{META_THEME_COLOR}}" />
<meta property="og:title" content="{{META_TITLE}}" />
<meta property="og:description" content="{{META_DESC}}" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />

<!-- Set theme before paint to avoid a flash of the wrong theme -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('dcr-theme');
      var sys = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      var t = saved || '{{THEME_DEFAULT}}' || sys;
      document.documentElement.className = t;
    } catch (e) {}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #08080c;
    --bg-2: #0d0d14;
    --panel: rgba(18, 20, 28, 0.66);
    --panel-solid: #14161f;
    --fg: #e9f7f2;
    --muted: #7f8c94;
    --primary: #00d4aa;
    --primary-2: #0a9c80;
    --accent: #ff2e97;
    --line: rgba(0, 212, 170, 0.22);
    --card-line: rgba(255, 255, 255, 0.08);
    --glow: 0 0 46px rgba(0, 212, 170, 0.28);
    --grid: rgba(0, 212, 170, 0.05);
    --font-display: 'Chakra Petch', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --maxw: 1140px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  html.light {
    --bg: #eef1f0;
    --bg-2: #e4e9e7;
    --panel: rgba(255, 255, 255, 0.78);
    --panel-solid: #ffffff;
    --fg: #08130f;
    --muted: #5a6b66;
    --primary: #00a582;
    --primary-2: #00c79f;
    --accent: #e01480;
    --line: rgba(0, 140, 110, 0.22);
    --card-line: rgba(0, 0, 0, 0.08);
    --glow: 0 0 40px rgba(0, 165, 130, 0.18);
    --grid: rgba(0, 140, 110, 0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-mono);
    background: var(--bg);
    color: var(--fg);
    line-height: 1.55;
    min-height: 100dvh;
    overflow-x: hidden;
    position: relative;
    transition: background 0.4s var(--ease), color 0.4s var(--ease);
  }

  /* ---- Backdrop layers ---- */
  #matrix {
    position: fixed; inset: 0; z-index: 0;
    width: 100%; height: 100%;
    opacity: 0.5; pointer-events: none;
  }
  html.light #matrix { opacity: 0.28; }
  .backdrop {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(0, 212, 170, 0.14), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(255, 46, 151, 0.08), transparent 55%),
      linear-gradient(180deg, var(--bg-2), var(--bg));
    background-attachment: fixed;
  }
  .grid-overlay {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 78%);
    -webkit-mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 78%);
  }
  .grain {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.05;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .wrap { position: relative; z-index: 2; max-width: var(--maxw); margin: 0 auto; padding: 0 22px; }

  /* ---- Header ---- */
  header {
    position: relative; z-index: 3;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 0 10px;
  }
  .brand {
    font-family: var(--font-display);
    font-weight: 700; font-size: 20px; letter-spacing: 0.02em;
    text-decoration: none; color: var(--fg);
    display: inline-flex; align-items: baseline; gap: 2px;
  }
  .brand b { color: var(--primary); }
  .brand .v {
    font-family: var(--font-mono); font-size: 12px; font-weight: 700;
    color: var(--bg); background: var(--primary);
    padding: 2px 6px; border-radius: 5px; margin-left: 8px;
    transform: translateY(-2px); box-shadow: var(--glow);
  }
  .toggle {
    appearance: none; cursor: pointer;
    width: 40px; height: 40px; border-radius: 11px;
    border: 1px solid var(--card-line); background: var(--panel);
    color: var(--fg); font-size: 16px; line-height: 1;
    display: grid; place-items: center; backdrop-filter: blur(8px);
    transition: border-color 0.25s, transform 0.25s var(--ease), color 0.25s;
  }
  .toggle:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }
  .toggle .moon { display: none; }
  html.light .toggle .sun { display: none; }
  html.light .toggle .moon { display: inline; }

  /* ---- Hero / hype ---- */
  .hero { padding: 40px 0 8px; text-align: center; }
  .badge {
    display: inline-flex; align-items: center; gap: 9px;
    font-family: var(--font-mono); font-size: 12px; font-weight: 700;
    letter-spacing: 0.22em; color: var(--primary);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 15px 7px 12px; background: var(--panel);
    backdrop-filter: blur(8px);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: blink 1.4s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }

  .kicker {
    margin-top: 26px; font-family: var(--font-mono);
    font-size: clamp(11px, 2.6vw, 13px); letter-spacing: 0.36em;
    color: var(--muted); text-transform: uppercase;
  }
  h1 {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(52px, 15vw, 148px); line-height: 0.92;
    letter-spacing: -0.02em; margin: 12px 0 4px;
    text-transform: uppercase;
    background: linear-gradient(180deg, var(--fg) 30%, var(--primary));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 60px rgba(0, 212, 170, 0.25);
  }
  html.light h1 { text-shadow: none; }
  .glitch { position: relative; }
  .subhead {
    max-width: 640px; margin: 20px auto 0;
    font-size: clamp(15px, 3.4vw, 19px); color: var(--fg);
  }
  .subhead b { color: var(--primary); font-weight: 700; }
  .eventline {
    margin-top: 16px; font-family: var(--font-mono);
    font-size: 13px; letter-spacing: 0.16em; color: var(--muted);
  }

  /* ---- Countdown ---- */
  .cd { margin: 46px auto 8px; max-width: 620px; }
  .cd-head { text-align: center; margin-bottom: 16px; }
  .cd-label {
    font-family: var(--font-mono); font-size: 12px; font-weight: 700;
    letter-spacing: 0.28em; color: var(--primary);
  }
  .cd-sub { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: 0.08em; }
  .cd-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .cd-cell {
    position: relative; text-align: center;
    border: 1px solid var(--card-line); border-radius: 14px;
    background: var(--panel); backdrop-filter: blur(10px);
    padding: 18px 6px 12px; overflow: hidden;
  }
  .cd-cell::before {
    content: ''; position: absolute; inset: 0 0 auto 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    opacity: 0.7;
  }
  .cd-num {
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(34px, 9vw, 56px); line-height: 1;
    color: var(--fg); font-variant-numeric: tabular-nums;
    text-shadow: 0 0 24px rgba(0, 212, 170, 0.28);
  }
  html.light .cd-num { text-shadow: none; }
  .cd-unit { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.22em; color: var(--muted); margin-top: 8px; }
  .cd-cell.tick .cd-num { animation: tick 0.5s var(--ease); }
  @keyframes tick { 0% { transform: translateY(-4px); opacity: 0.4; } 100% { transform: translateY(0); opacity: 1; } }
  .cd-done {
    grid-column: 1 / -1; text-align: center;
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(24px, 7vw, 44px); color: var(--primary);
    letter-spacing: 0.04em; padding: 22px 0;
    text-shadow: var(--glow);
  }

  /* ---- Cards ---- */
  .cards {
    margin: 56px 0 20px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
  }
  .card {
    position: relative; display: flex; flex-direction: column;
    border: 1px solid var(--card-line); border-radius: 18px;
    background: var(--panel); backdrop-filter: blur(12px);
    text-decoration: none; color: var(--fg); overflow: hidden;
    transition: transform 0.4s var(--ease), border-color 0.3s, box-shadow 0.4s var(--ease);
  }
  .card::after {
    content: ''; position: absolute; inset: 0; border-radius: 18px; pointer-events: none;
    box-shadow: inset 0 0 0 1px transparent; transition: box-shadow 0.3s;
  }
  .card:hover {
    transform: translateY(-8px);
    border-color: var(--primary);
    box-shadow: 0 24px 60px -24px rgba(0, 212, 170, 0.5), var(--glow);
  }
  .card-media {
    position: relative; aspect-ratio: 16 / 10; overflow: hidden;
    background:
      radial-gradient(120% 120% at 20% 0%, rgba(0, 212, 170, 0.28), transparent 60%),
      radial-gradient(120% 120% at 100% 100%, rgba(255, 46, 151, 0.2), transparent 55%),
      var(--panel-solid);
    display: grid; place-items: center;
  }
  .card-media img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transition: transform 0.6s var(--ease);
  }
  .card-media img.img-fail { opacity: 0; }
  .card:hover .card-media img { transform: scale(1.06); }
  .card-emoji {
    font-size: 46px; filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.4));
    z-index: 1; transition: transform 0.5s var(--ease);
  }
  .card:hover .card-emoji { transform: scale(1.12) translateY(-2px); }
  .card-media::before {
    content: ''; position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, transparent 45%, rgba(8, 8, 12, 0.55));
  }
  html.light .card-media::before { background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.12)); }
  .card-body { padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card-kicker { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em; color: var(--primary); }
  .card-title { font-family: var(--font-display); font-weight: 700; font-size: 23px; letter-spacing: 0.01em; }
  .card-blurb { font-size: 14px; color: var(--muted); flex: 1; }
  .card-cta {
    margin-top: 8px; font-family: var(--font-mono); font-size: 13px; font-weight: 700;
    letter-spacing: 0.04em; color: var(--fg);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .card-cta .arrow { color: var(--primary); transition: transform 0.3s var(--ease); }
  .card:hover .card-cta .arrow { transform: translateX(5px); }

  /* ---- Footer ---- */
  footer {
    position: relative; z-index: 2;
    margin-top: 30px; padding: 30px 0 46px;
    border-top: 1px solid var(--card-line);
    display: flex; flex-wrap: wrap; gap: 10px 18px;
    align-items: center; justify-content: space-between;
    font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.06em;
  }
  footer a { color: var(--primary); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  .foot-note b { color: var(--fg); font-weight: 700; }

  /* ---- Load-in reveal ---- */
  .reveal { opacity: 0; transform: translateY(18px); animation: rise 0.9s var(--ease) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); gap: 14px; }
  }
  @media (max-width: 560px) {
    .cards { grid-template-columns: 1fr; }
    .card-media { aspect-ratio: 16 / 8; }
  }
  @media (max-width: 460px) {
    .cd-grid { gap: 8px; }
    .cd-cell { padding: 14px 3px 10px; border-radius: 11px; }
    .wrap { padding: 0 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #matrix { display: none; }
    .reveal { animation: none; opacity: 1; transform: none; }
    .dot { animation: none; }
    * { scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="wrap">
    <header>
      <a class="brand" href="https://run.defcon.run" target="_blank" rel="noopener noreferrer">{{BRAND_WORDMARK_HTML}}<span class="v">{{BRAND_VERSION}}</span></a>
      <button class="toggle" id="themeToggle" type="button" aria-label="Toggle color theme">
        <span class="sun">☀</span><span class="moon">☾</span>
      </button>
    </header>

    <section class="hero">
      <span class="badge reveal" style="animation-delay: 0.05s"><span class="dot"></span>{{HYPE_BADGE}}</span>
      <p class="kicker reveal" style="animation-delay: 0.12s">{{HYPE_KICKER}}</p>
      <h1 class="glitch reveal" style="animation-delay: 0.18s">{{HYPE_HEADLINE}}</h1>
      <p class="subhead reveal" style="animation-delay: 0.28s">{{HYPE_SUBHEAD}}</p>
      <p class="eventline reveal" style="animation-delay: 0.36s">{{HYPE_EVENTLINE}}</p>
    </section>

    <section class="cd reveal" style="animation-delay: 0.44s" aria-label="Countdown">
      <div class="cd-head">
        <div class="cd-label">{{CD_LABEL}}</div>
        <div class="cd-sub">{{CD_SUBLABEL}}</div>
      </div>
      <div class="cd-grid" id="cd-grid">
        <div class="cd-cell"><div class="cd-num" data-cd="days">--</div><div class="cd-unit">{{CD_U_DAYS}}</div></div>
        <div class="cd-cell"><div class="cd-num" data-cd="hours">--</div><div class="cd-unit">{{CD_U_HOURS}}</div></div>
        <div class="cd-cell"><div class="cd-num" data-cd="minutes">--</div><div class="cd-unit">{{CD_U_MINUTES}}</div></div>
        <div class="cd-cell"><div class="cd-num" data-cd="seconds">--</div><div class="cd-unit">{{CD_U_SECONDS}}</div></div>
      </div>
    </section>

    <section class="cards" aria-label="Where to go">
      {{CARDS}}
    </section>

    <footer>
      <span class="foot-note"><b>{{FOOTER_TEXT}}</b> · {{FOOTER_NOTE}}</span>
      <span>{{FOOTER_LINKS}}</span>
    </footer>
  </div>

  <script>
    // ---------- Theme toggle ----------
    (function () {
      var btn = document.getElementById('themeToggle');
      btn.addEventListener('click', function () {
        var next = document.documentElement.className === 'light' ? 'dark' : 'light';
        document.documentElement.className = next;
        try { localStorage.setItem('dcr-theme', next); } catch (e) {}
      });
    })();

    // ---------- Countdown ----------
    (function () {
      var target = new Date({{CD_TARGET_JSON}}).getTime();
      var doneText = {{CD_DONE_JSON}};
      var grid = document.getElementById('cd-grid');
      var cells = {
        days: document.querySelector('[data-cd="days"]'),
        hours: document.querySelector('[data-cd="hours"]'),
        minutes: document.querySelector('[data-cd="minutes"]'),
        seconds: document.querySelector('[data-cd="seconds"]')
      };
      var last = {};
      function pad(n, w) { n = String(n); while (n.length < (w || 2)) n = '0' + n; return n; }
      function tick() {
        var diff = target - Date.now();
        if (diff <= 0) {
          grid.innerHTML = '<div class="cd-done">' + doneText + '</div>';
          return;
        }
        var s = Math.floor(diff / 1000);
        var v = {
          days: Math.floor(s / 86400),
          hours: Math.floor((s % 86400) / 3600),
          minutes: Math.floor((s % 3600) / 60),
          seconds: s % 60
        };
        for (var k in cells) {
          var str = k === 'days' ? pad(v[k], 2) : pad(v[k], 2);
          if (last[k] !== str) {
            cells[k].textContent = str;
            var cell = cells[k].parentElement;
            cell.classList.remove('tick'); void cell.offsetWidth; cell.classList.add('tick');
            last[k] = str;
          }
        }
        requestAnimationFrame(function () { setTimeout(tick, 250); });
      }
      tick();
    })();

    // ---------- Matrix rain ----------
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var c = document.getElementById('matrix');
      var ctx = c.getContext('2d');
      var glyphs = '01</>{}[]#$ラ ンドセキュ▚▞◆·'.split('');
      var fontSize = 15, cols, drops, w, h, dpr;
      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = c.width = Math.floor(innerWidth * dpr);
        h = c.height = Math.floor(innerHeight * dpr);
        c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
        cols = Math.floor(innerWidth / fontSize);
        drops = new Array(cols).fill(0).map(function () { return Math.random() * -50; });
      }
      resize();
      addEventListener('resize', resize);
      var accent = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#00d4aa';
      var last = 0;
      function draw(ts) {
        if (ts - last > 55) {
          last = ts;
          var light = document.documentElement.className === 'light';
          ctx.fillStyle = light ? 'rgba(238,241,240,0.28)' : 'rgba(8,8,12,0.28)';
          ctx.fillRect(0, 0, w, h);
          ctx.font = (fontSize * dpr) + "px 'JetBrains Mono', monospace";
          for (var i = 0; i < cols; i++) {
            var txt = glyphs[Math.floor(Math.random() * glyphs.length)];
            var x = i * fontSize * dpr;
            var y = drops[i] * fontSize * dpr;
            ctx.fillStyle = Math.random() > 0.975 ? (light ? '#0a1a16' : '#ffffff') : accent;
            ctx.fillText(txt, x, y);
            if (y > h && Math.random() > 0.975) drops[i] = Math.random() * -20;
            drops[i]++;
          }
        }
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
