name: dcr34

services:
  
  run:
    container_name: run

    build:
      context: run.human/webapp
      dockerfile: Dockerfile.webapp.dev
    
    ports:
      - "1337:1337"
      - "3001:3001"
      - "3002:3002"
      - "8000:8000"

    environment:
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - NODE_ENV=development
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - NEXTAUTH_URL=http://localhost:3001
      - AUTH_JWT_SECRET=devdevdev
      - RUN_DYNAMODB_ID=local
      - RUN_DYNAMODB_SECRET=local
      - RUN_DYNAMODB_REGION=us-east-1
      - RUN_DYNAMODB_ENDPOINT=http://localhost:8000
      - RUN_DYNAMODB_DBNAME=run-human-authjs
      - RUN_ELECTRO_ID=local
      - RUN_ELECTRO_SECRET=local
      - RUN_ELECTRO_ENDPOINT=http://localhost:8000
      - RUN_ELECTRO_DBNAME=run-human-electro
      - OIDC_RUNHUMAN_CLIENT_ID=run-human
      - OIDC_RUNHUMAN_SECRET=run-human-dev-secret-12345
      - RUN_SES_REGION=us-east-1
      - RUN_SES_SMTP_FROM=no-reply@run.defcon.run
      - AUTH_INTERNAL_SECRET=your-secret-here-make-it-long-and-random
      # S3 Upload bucket credentials (use real AWS creds for local dev, or localstack)
      - S3_UPLOADS_ACCESS_KEY=${AWS_ACCESS_KEY_ID:-local}
      - S3_UPLOADS_SECRET_KEY=${AWS_SECRET_ACCESS_KEY:-local}
      - S3_UPLOADS_BUCKET=${S3_UPLOADS_BUCKET:-uploads-local-dev}
      - S3_UPLOADS_REGION=${AWS_REGION:-us-east-1}

    command:
      - npm
      - run
      - dev
      - -p "3001"

  auth:
    container_name: auth
    network_mode: "service:run"
    depends_on:
      dynamodb:
        condition: service_healthy

    build:
      context: run.auth/webapp
      dockerfile: Dockerfile.webapp.dev

    environment:
      - PORT=3002
      - HOSTNAME=0.0.0.0
      - NODE_ENV=development
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - NEXTAUTH_URL=http://localhost:3002
      - AUTH_JWT_SECRET=devdevdev
      - AUTH_DYNAMODB_ID=local
      - AUTH_DYNAMODB_SECRET=local
      - AUTH_DYNAMODB_REGION=us-east-1
      - AUTH_DYNAMODB_ENDPOINT=http://localhost:8000
      - AUTH_DYNAMODB_DBNAME=run-auth-authjs
      - AUTH_ELECTRO_ID=local
      - AUTH_ELECTRO_SECRET=local
      - AUTH_ELECTRO_DBNAME=run-auth-electro
      - AUTH_ELECTRO_ENDPOINT=http://localhost:8000
      - OIDC_RUNHUMAN_CLIENT_ID=run-human
      - OIDC_COOKIE_KEYS=oidc-dev-secret-key-1,oidc-dev-secret-key-2
      - OIDC_RUNHUMAN_SECRET=run-human-dev-secret-12345
      - AUTH_SES_REGION=us-east-1
      - AUTH_SES_SMTP_FROM=reply-to@email.defcon.run
      - AUTH_INTERNAL_SECRET=your-secret-here-make-it-long-and-random 

    env_file:
      - run.auth/webapp/.env.local

    command:
      - npm
      - run
      - dev
      - -p "3002"

  cms:
    container_name: cms
    network_mode: "service:run"
    build:
      context: run.cms/app
      dockerfile: Dockerfile.app.dev
    environment:
      - PORT=1337
      - HOSTNAME=0.0.0.0
      - NODE_ENV=development
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}

    volumes:
      - ./run.cms/app/data:/app/data

    env_file:
      - run.cms/app/.env

    command:
      - npm
      - run
      - develop
      - -p "1337"
      
  dynamodb:
    network_mode: "service:run"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory -disableTelemetry"
    image: "amazon/dynamodb-local:latest"
    container_name: dynamodb
    working_dir: /home/dynamodblocal
    healthcheck:
      test: ["CMD-SHELL", "curl -s -A 'HealthChecker' http://localhost:8000 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_interval: 500ms
      start_period:  5s
  
  db-init:
    image: amazon/aws-cli:latest
    container_name: db-init
    network_mode: "service:run"
    depends_on:
      dynamodb:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./local/dynamodb/init-local-db.sh:/init-local-db.sh:ro
    entrypoint: ["/bin/bash", "/init-local-db.sh"]
