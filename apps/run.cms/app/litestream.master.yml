# Litestream configuration for CMS Master
# Continuously replicates SQLite database to S3

dbs:
  - path: ${DATABASE_FILENAME}
    replicas:
      - type: s3
        bucket: ${S3_LITESTREAM_BUCKET}
        path: strapi
        region: ${S3_LITESTREAM_REGION}
        access-key-id: ${S3_LITESTREAM_ACCESS_KEY}
        secret-access-key: ${S3_LITESTREAM_SECRET_KEY}
        # Sync interval: replicate every second for near-realtime
        sync-interval: 1s
        # Retain snapshots for 24 hours
        retention: 24h
        # Take snapshot every hour
        snapshot-interval: 1h
        # Validation interval
        validation-interval: 10m
