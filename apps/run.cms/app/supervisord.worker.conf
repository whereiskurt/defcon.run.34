[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[program:litestream-sync]
command=/app/litestream-sync.sh
autostart=true
autorestart=true
startsecs=5
startretries=10
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:strapi]
command=/bin/sh -c "until [ -f /data/.db-ready ]; do echo 'Waiting for database restore...'; sleep 2; done && npm run start"
directory=/app
autostart=true
autorestart=true
startsecs=10
startretries=5
priority=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production"

[eventlistener:quit_on_exit]
command=/bin/sh -c "while read line; do echo \"$line\" | grep -q 'PROCESS_STATE_FATAL' && kill $(cat /tmp/supervisord.pid); done"
events=PROCESS_STATE
