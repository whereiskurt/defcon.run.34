events {
  worker_connections 1024;
}

http {
  server_tokens off;

  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  set_real_ip_from 0.0.0.0/0;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  include       mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  # Larger buffer sizes for Strapi admin panel
  proxy_buffer_size 128k;
  proxy_buffers 4 256k;
  proxy_busy_buffers_size 256k;

  upstream strapi_app {
    server localhost:1337;
  }

  server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    client_max_body_size 100M;

    location /hello {
      default_type "text/html";
      add_header x-health-check alive-canary-0001;
      add_header x-release-version v0.0.1;
      add_header x-app-identifier HealthCheck;
      return 200 '<html><head><title>Hello (v0.0.1)</title></head><body><h1>Hello, World !</h1></body></html>';
    }

    # Admin routes - handle SPA and API differently
    # - HTML requests (Accept: text/html): pass through (Strapi serves admin at /use1/admin)
    # - API requests (Accept: application/json or non-GET): strip prefix (API is at /admin/*)
    location ~ ^/(use1|cac1)/admin(/.*)?$ {
      set $do_rewrite 0;

      # Non-GET requests are always API calls
      if ($request_method != GET) {
        set $do_rewrite 1;
      }

      # GET requests with Accept: application/json are API calls
      if ($http_accept ~* "application/json") {
        set $do_rewrite 1;
      }

      # Rewrite API requests to strip region prefix
      if ($do_rewrite = 1) {
        rewrite ^/(use1|cac1)/admin(.*)$ /admin$2 break;
      }

      proxy_pass http://strapi_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Region-Short $1;
      proxy_cache_bypass $http_upgrade;

      add_header x-app-identifier CMS;
      add_header x-release-version v0.0.1;
    }

    # SSO plugin routes - strip regional prefix as plugin doesn't know about it
    # /use1/strapi-plugin-sso/* -> /strapi-plugin-sso/*
    location ~ ^/(use1|cac1)/strapi-plugin-sso(/.*)?$ {
      rewrite ^/(use1|cac1)/strapi-plugin-sso(.*)$ /strapi-plugin-sso$2 break;
      proxy_pass http://strapi_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Region-Short $1;
      proxy_cache_bypass $http_upgrade;

      add_header x-app-identifier CMS;
      add_header x-release-version v0.0.1;
    }

    # All other regional routes - strip prefix for API calls
    # /use1/upload/* -> /upload/*, /use1/api/* -> /api/*, etc.
    # Strapi API endpoints don't know about the region prefix
    location ~ ^/(use1|cac1)(/.*)?$ {
      rewrite ^/(use1|cac1)(.*)$ $2 break;
      proxy_pass http://strapi_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Region-Short $1;
      proxy_cache_bypass $http_upgrade;

      add_header x-app-identifier CMS;
      add_header x-release-version v0.0.1;
    }

    # Fix Strapi bug: hardcoded /admin/auth/login redirect doesn't include region prefix
    # Redirect to default region (use1) - user's session will be there anyway
    location = /admin/auth/login {
      return 302 /use1/admin/auth/login;
    }

    # Fallback for non-prefixed requests (direct/internal access via service discovery)
    location / {
      proxy_pass http://strapi_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_cache_bypass $http_upgrade;

      add_header x-app-identifier CMS;
      add_header x-release-version v0.0.1;
    }

  }
}
