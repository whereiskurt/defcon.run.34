<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>configui.defcon.run</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            body: ['Atkinson Hyperlegible', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
          },
          colors: {
            green: { 400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d' },
          }
        }
      }
    }
  </script>
</head>
<body class="bg-zinc-50 dark:bg-zinc-900 text-zinc-900 dark:text-zinc-50 font-body min-h-screen">
  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-zinc-950/90 backdrop-blur border-b border-zinc-200 dark:border-green-900/50">
    <div class="max-w-[1800px] mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <span id="header-zone-name" class="text-2xl font-bold font-mono text-zinc-400 leading-none">{{.Config.DNS.ZoneName}}</span>
        <span class="text-2xl font-bold tracking-tight font-mono leading-none"><span class="text-green-500 dark:text-green-400">%</span> <span class="text-zinc-400">./</span><span class="text-green-500 dark:text-green-400 cursor-blink">configui</span></span>
        <img src="/static/dcjack.svg" alt="DC" class="w-7 h-7 header-bunny drop-shadow-[0_0_6px_rgba(34,197,94,0.5)]">
        <span id="header-site-label" class="text-xs text-green-600 dark:text-green-400 bg-green-50 dark:bg-green-900/30 border border-green-200 dark:border-green-800 px-2 py-0.5 rounded font-mono">{{.Config.Site.Label}}</span>
        <div class="w-px h-6 bg-zinc-300 dark:bg-zinc-700"></div>
        <button type="button" onclick="confirmExport()"
                class="rounded-md bg-zinc-200 dark:bg-zinc-700 hover:bg-zinc-300 dark:hover:bg-zinc-600 px-4 py-2 text-sm font-medium flex items-center gap-1.5"
                title="Export configuration to disk">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          Export
        </button>
        <button type="button" onclick="confirmImport()"
                class="rounded-md bg-zinc-200 dark:bg-zinc-700 hover:bg-zinc-300 dark:hover:bg-zinc-600 px-4 py-2 text-sm font-medium flex items-center gap-1.5"
                title="Import configuration from JSON file">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          Import
        </button>
        <button type="button"
                onclick="confirmReload()"
                class="rounded-md bg-zinc-200 dark:bg-zinc-700 hover:bg-zinc-300 dark:hover:bg-zinc-600 px-4 py-2 text-sm font-medium flex items-center gap-1.5"
                title="Reload config from site.hcl and service files">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.5 2v6h6M2.66 12a9 9 0 1017.94-2.02A9 9 0 002.66 12z"/></svg>
          Reload
        </button>
      </div>
      <div class="flex items-center gap-2">
        <div id="save-result"></div>
        <button type="button"
                class="rounded-md bg-green-700 hover:bg-green-600 text-white px-4 py-2 text-sm font-medium flex items-center gap-1.5"
                hx-post="/api/sso-login" hx-target="#aws-action-result" hx-swap="innerHTML">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.003 4.003 0 003 15z"/></svg>
          SSO Login
        </button>
        <button type="button" id="preview-toggle-btn"
                class="rounded-md border-2 border-green-600 text-green-400 hover:bg-green-700 hover:text-white px-4 py-2 text-sm font-medium font-mono flex items-center gap-1.5 transition-colors"
                onclick="if(isPreviewOpen()){hidePreview();}else{showPreview();htmx.ajax('POST','/preview',{source:'#config-form',target:'#preview-content',swap:'innerHTML'});}">
          <svg id="preview-icon-open" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          <svg id="preview-icon-close" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M3 3l18 18"/></svg>
          Preview
        </button>
        <div class="relative" id="history-dropdown-wrapper" onclick="event.stopPropagation();">
          <button type="button" id="history-toggle-btn"
                  class="rounded-md border-2 border-zinc-600 text-zinc-400 hover:bg-zinc-700 hover:text-white px-4 py-2 text-sm font-medium font-mono flex items-center gap-1.5 transition-colors"
                  onclick="toggleHistoryDropdown()">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            Runs
            <span id="history-badge" class="hidden bg-green-600 text-white text-[10px] font-bold rounded-full px-1.5 leading-4 min-w-[18px] text-center">0</span>
          </button>
          <div id="history-dropdown-menu" class="history-menu hidden"></div>
        </div>
        <button type="button" onclick="openOutputExplorer()"
                class="rounded-md border-2 border-zinc-600 text-zinc-400 hover:bg-zinc-700 hover:text-white px-4 py-2 text-sm font-medium font-mono flex items-center gap-1.5 transition-colors"
                title="Browse terraform outputs across modules">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/>
          </svg>
          Outputs
        </button>
        <button type="button" onclick="openRRDBExplorer()"
                class="rounded-md border-2 border-zinc-600 text-zinc-400 hover:bg-zinc-700 hover:text-white px-4 py-2 text-sm font-medium font-mono flex items-center gap-1.5 transition-colors"
                title="Execution stats (plan/apply history)">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
          Stats
        </button>
        <button onclick="toggleTheme()" class="p-2 rounded-md hover:bg-zinc-200 dark:hover:bg-zinc-700" title="Toggle theme">
          <svg class="w-5 h-5 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg class="w-5 h-5 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Unsaved changes banner -->
  <div id="unsaved-banner" class="hidden sticky top-[57px] z-30 bg-amber-900/90 border-b border-amber-700/50 px-4 py-2 flex items-center gap-3">
    <svg class="w-4 h-4 text-amber-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    <span class="text-xs font-mono text-amber-300 flex-1">You have unsaved changes. Click <strong>Save All</strong> to write site.hcl, service files, and env scripts.</span>
    <button type="button" onclick="doSaveAll()" class="rounded-md bg-green-600 hover:bg-green-500 text-white px-3 py-1 text-xs font-mono font-medium flex-shrink-0">Save All</button>
    <button type="button" onclick="dismissUnsavedBanner()" class="text-amber-500 hover:text-amber-300 text-lg leading-none px-1" title="Dismiss">&times;</button>
  </div>

  <!-- Content wrapper: main + preview side by side -->
  <div id="content-wrapper" class="flex">
    <!-- Main content -->
    <main id="main-content" class="flex-1 min-w-0 px-4 py-6 transition-all duration-200">
      <!-- AWS Status section header + panel -->
      <div id="aws-status"
           hx-get="/api/aws-status" hx-trigger="load, refreshAwsStatus from:body" hx-swap="innerHTML">
        <div class="border-t border-green-300 dark:border-green-800/50 pt-4 flex items-center gap-2 mb-4">
          <button type="button" class="global-fold-btn" title="Expand/Collapse">+</button>
          <span class="text-xl font-mono font-bold text-zinc-500 dark:text-zinc-400">Verifying AWS...</span>
        </div>
        <div class="border-t border-green-300 dark:border-green-800/50"></div>
      </div>
      <div id="aws-action-result" class="empty:hidden"></div>

      <form id="config-form" method="POST">
        {{template "form.html" .}}
      </form>
    </main>

    <!-- Drag handle between main content and preview -->
    <div id="preview-drag-handle" class="hidden preview-drag-handle"></div>

    <!-- Preview panel (inline, pushes content left) -->
    <aside id="preview-panel" class="hidden flex-shrink-0 border-l border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 h-[calc(100vh-57px)] sticky top-[57px] flex flex-col" style="width:50%">
      <div class="flex-shrink-0 border-b border-zinc-200 dark:border-zinc-700 px-4 py-3 flex justify-between items-center">
        <h2 class="font-bold text-sm">Preview</h2>
        <button onclick="hidePreview()" class="text-zinc-400 hover:text-zinc-500 dark:hover:text-zinc-200 text-lg px-1" title="Close (Esc)">&times;</button>
      </div>
      <div id="preview-content" class="flex-1 overflow-auto p-4">
        <p class="text-sm text-zinc-400">Click Preview to generate...</p>
      </div>
      <div class="flex-shrink-0 border-t border-zinc-200 dark:border-zinc-700 px-4 py-3">
        <button type="button"
                class="rounded-md bg-green-600 hover:bg-green-500 text-white px-4 py-2 text-sm font-medium w-full"
                onclick="confirmSaveAll()">
          Save All
        </button>
      </div>
    </aside>
  </div>

  <!-- Discovery data carrier (hidden, htmx-polled) -->
  <div id="discovery-container" class="hidden"
       hx-get="/api/discovery" hx-trigger="load delay:2s, refreshDiscovery from:body, every 2s [discoveryRunning()]"
       hx-swap="innerHTML">
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="fixed bottom-14 right-4 z-[56] flex flex-col gap-2"></div>

  <!-- Destroy mode explosion overlay -->
  <div id="destroy-explosion"></div>

  <script>window.FORM_DEFAULTS = {{.DefaultsJSON}};
  window.ALL_REGIONS = {{.AllRegionsJSON}};</script>
  <script src="/static/app.js"></script>
</body>
</html>
