{{define "site.html"}}
<div class="rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 shadow-sm overflow-hidden mod-group-core" data-panel="site" data-module-num="C2">
  <div class="flex justify-between items-center px-4 py-3 cursor-pointer hover:bg-zinc-50 dark:hover:bg-zinc-700/50" onclick="togglePanel('site')">
    <h3 class="text-base font-semibold relative"><span class="module-num">C2</span>Site Identity</h3>
    <svg class="w-4 h-4 chevron" id="chevron-site" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
  </div>
  <div class="border-t border-zinc-200 dark:border-zinc-700 px-4 py-3 space-y-3" id="body-site" style="display:none">
    <div>
      <label class="text-xs uppercase tracking-wide text-zinc-500 dark:text-zinc-400 mb-1 block">Label</label>
      <input type="text" name="site.label" value="{{.Config.Site.Label}}" class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm focus:ring-2 focus:ring-green-500">
    </div>
    <div>
      <label class="text-xs uppercase tracking-wide text-zinc-500 dark:text-zinc-400 mb-1 block">GitHub Repo Name</label>
      <input type="text" name="site.github_repo_name" value="{{.Config.Site.GitHubRepoName}}" class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm focus:ring-2 focus:ring-green-500">
    </div>
    <div>
      <label class="text-xs uppercase tracking-wide text-zinc-500 dark:text-zinc-400 mb-1 block">TF State Prefix</label>
      <input type="text" name="site.tf_state_prefix" value="{{.Config.Site.TFStatePrefix}}" class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm focus:ring-2 focus:ring-green-500">
    </div>
    <div>
      <label class="text-xs uppercase tracking-wide text-zinc-500 dark:text-zinc-400 mb-1 block">Random Suffix</label>
      <input type="text" name="site.random_suffix" value="{{.Config.Site.RandomSuffix}}" class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm focus:ring-2 focus:ring-green-500 pii-blur" onclick="this.classList.add('pii-revealed')">
    </div>
    <div>
      <label class="text-xs uppercase tracking-wide text-zinc-500 dark:text-zinc-400 mb-1 block">Skip Regions (comma-separated)</label>
      <input type="text" name="site.skip_regions" value="{{join .Config.Site.SkipRegions ","}}" class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm focus:ring-2 focus:ring-green-500" placeholder="e.g. ap-southeast-1">
    </div>
  </div>
</div>
{{end}}
