{{define "email.html"}}
<div class="rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 shadow-sm overflow-hidden {{if not .Config.Email.Enabled}}panel-disabled{{end}}" data-panel="email">
  <div class="flex justify-between items-center px-4 py-3 cursor-pointer hover:bg-zinc-50 dark:hover:bg-zinc-700/50" onclick="togglePanel('email')">
    <div class="flex items-center gap-3">
      <input type="checkbox" name="email.enabled" class="toggle-switch" {{if .Config.Email.Enabled}}checked{{end}} onclick="event.stopPropagation(); toggleModule('email', this)">
      <h3 class="text-base font-semibold">Email (SES)</h3>
      <span class="text-xs text-zinc-400">SMTP + forwarding</span>
    </div>
    <svg class="w-4 h-4 chevron" id="chevron-email" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
  </div>
  <div class="panel-body border-t border-zinc-200 dark:border-zinc-700 px-4 py-3 space-y-3" id="body-email" style="display:none">
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-xs uppercase tracking-wide text-zinc-500 dark:text-zinc-400 mb-1 block">Primary Region</label>
        <input type="text" name="email.primary_region" value="{{.Config.Email.PrimaryRegion}}" class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm focus:ring-2 focus:ring-cyan-500">
      </div>
      <div>
        <label class="text-xs uppercase tracking-wide text-zinc-500 dark:text-zinc-400 mb-1 block">SMTP Prefix</label>
        <input type="text" name="email.smtp_prefix" value="{{.Config.Email.SMTPPrefix}}" class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm focus:ring-2 focus:ring-cyan-500">
      </div>
    </div>
    <div class="flex flex-wrap gap-4">
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="email.make_site_domain" class="toggle-switch" {{if .Config.Email.MakeSiteDomain}}checked{{end}}> Make Site Domain</label>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="email.make_regional_domains" class="toggle-switch" {{if .Config.Email.MakeRegionalDomains}}checked{{end}}> Make Regional Domains</label>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="email.make_domains" class="toggle-switch" {{if .Config.Email.MakeDomains}}checked{{end}}> Make Domains</label>
    </div>
    <div>
      <label class="text-xs uppercase tracking-wide text-zinc-500 dark:text-zinc-400 mb-1 block">Replica Regions</label>
      <div class="flex gap-4">
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="email.regions.use1" {{if hasRegion .Config.Email.ReplicaRegions "use1"}}checked{{end}} class="rounded"> use1</label>
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="email.regions.cac1" {{if hasRegion .Config.Email.ReplicaRegions "cac1"}}checked{{end}} class="rounded"> cac1</label>
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="email.regions.apse1" {{if hasRegion .Config.Email.ReplicaRegions "apse1"}}checked{{end}} class="rounded"> apse1</label>
      </div>
    </div>
  </div>
</div>
{{end}}
