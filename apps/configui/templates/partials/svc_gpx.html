{{define "svc_gpx.html"}}
<div class="rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 shadow-sm overflow-hidden mod-svc-gpx" data-panel="svc_gpx" data-module-num="S4">
  <div class="flex justify-between items-center px-4 py-3 cursor-pointer hover:bg-zinc-50 dark:hover:bg-zinc-700/50" onclick="togglePanel('svc_gpx')">
    <div class="flex items-center gap-3">
      <span class="drag-handle" title="Drag to reorder">⠿</span>
      <h3 class="text-base font-semibold relative"><span class="module-num">S4</span>run.gpx</h3>
      <span class="text-xs text-zinc-400">GPX editor (single container)</span>
    </div>
    <svg class="w-4 h-4 chevron" id="chevron-svc_gpx" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
  </div>
  <div class="panel-body border-t border-zinc-200 dark:border-zinc-700 px-4 py-3 space-y-4" id="body-svc_gpx" style="display:none">
    <div>
      <h4 class="text-xs uppercase tracking-wide text-green-500 mb-2">Task Definition</h4>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs text-zinc-400 mb-1 block">Task CPU</label><input type="number" name="svc.gpx.task_cpu" value="{{.Config.Services.GPX.Task.TaskCPU}}" class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm focus:ring-2 focus:ring-green-500"></div>
        <div><label class="text-xs text-zinc-400 mb-1 block">Task Memory</label><input type="number" name="svc.gpx.task_memory" value="{{.Config.Services.GPX.Task.TaskMemory}}" class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm focus:ring-2 focus:ring-green-500"></div>
      </div>
    </div>
    <div>
      <h4 class="text-xs uppercase tracking-wide text-green-500 mb-2">App Container</h4>
      <div class="grid grid-cols-3 gap-3">
        <div><label class="text-xs text-zinc-400 mb-1 block">CPU</label><input type="number" name="svc.gpx.app.cpu" value="{{.Config.Services.GPX.App.CPU}}" class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm focus:ring-2 focus:ring-green-500"></div>
        <div><label class="text-xs text-zinc-400 mb-1 block">Memory</label><input type="number" name="svc.gpx.app.memory" value="{{.Config.Services.GPX.App.Memory}}" class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm focus:ring-2 focus:ring-green-500"></div>
        <div><label class="text-xs text-zinc-400 mb-1 block">Mem Reservation</label><input type="number" name="svc.gpx.app.mem_reservation" value="{{.Config.Services.GPX.App.MemoryReservation}}" class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm focus:ring-2 focus:ring-green-500"></div>
      </div>
    </div>
    <div>
      <h4 class="text-xs uppercase tracking-wide text-green-500 mb-2">Service</h4>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs text-zinc-400 mb-1 block">Desired Count</label><input type="number" name="svc.gpx.desired_count" value="{{.Config.Services.GPX.Service.DesiredCount}}" class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm focus:ring-2 focus:ring-green-500"></div>
        <div class="flex items-end gap-3 pb-2"><label class="flex items-center gap-2 text-sm"><input type="checkbox" name="svc.gpx.autoscaling.enabled" class="toggle-switch" {{if .Config.Services.GPX.Service.Autoscaling.Enabled}}checked{{end}}> Autoscaling</label></div>
      </div>
      <div class="grid grid-cols-2 gap-3 mt-2">
        <div><label class="text-xs text-zinc-400 mb-1 block">Min</label><input type="number" name="svc.gpx.autoscaling.min" value="{{.Config.Services.GPX.Service.Autoscaling.MinCapacity}}" class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm focus:ring-2 focus:ring-green-500"></div>
        <div><label class="text-xs text-zinc-400 mb-1 block">Max</label><input type="number" name="svc.gpx.autoscaling.max" value="{{.Config.Services.GPX.Service.Autoscaling.MaxCapacity}}" class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm focus:ring-2 focus:ring-green-500"></div>
      </div>
    </div>
  </div>
</div>
{{end}}
