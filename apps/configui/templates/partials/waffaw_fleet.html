{{define "waffaw_fleet.html"}}
<div class="space-y-4">
  <!-- Fleet Configuration (Terraform Inputs) -->
  <div>
    <!-- IP & Quota Summary -->
    <div id="waf-quota-bar" class="mb-3 rounded-md border border-zinc-200 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-xs font-mono space-y-1">
      <div id="waf-region-quotas" class="flex items-center gap-4 flex-wrap text-zinc-500" style="display:none">
        <span class="text-zinc-400">EIP Quotas:</span>
        <span id="waf-eip-warn" class="hidden text-amber-400 font-medium ml-auto">Checking EIP quota...</span>
      </div>
      <div class="flex items-center gap-4 flex-wrap">
        <span class="text-zinc-400">Public IPs:</span>
        <span id="waf-ip-total" class="text-zinc-200 font-medium">0</span>
        <span class="text-zinc-600">|</span>
        <span class="text-zinc-400">EIPs (EC2):</span>
        <span id="waf-eip-count" class="text-zinc-200">0</span>
        <span class="text-zinc-400">Transient (Fargate):</span>
        <span id="waf-fargate-ips" class="text-zinc-200">0</span>
        <span class="text-zinc-600">|</span>
        <span class="text-zinc-400">IPv4 cost:</span>
        <span id="waf-ip-cost" class="text-zinc-200">$0/mo</span>
      </div>
    </div>

    <h4 class="text-xs uppercase tracking-wide text-green-500 mb-2">Fleet Configuration</h4>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

      <!-- EC2 Column -->
      <div class="space-y-2">
        <input type="hidden" name="waffaw.ec2_use_spot" id="waf-ec2-spot-val" value="{{if .Config.Waffaw.EC2UseSpot}}on{{end}}">
        <div class="flex items-center gap-2">
          <div class="seg-group inline-flex rounded-md text-xs font-medium" data-target="waf-ec2-spot-val" data-on-value="on" data-off-value="">
            <button type="button" data-seg="on" class="seg-btn rounded-l-md px-3 py-1 border border-zinc-600">EC2 Spot</button>
            <button type="button" data-seg="" class="seg-btn rounded-r-md px-3 py-1 border border-l-0 border-zinc-600">Reserved</button>
          </div>
          <select name="waffaw.ec2_instance_type" class="rounded-md border border-zinc-600 bg-zinc-900 px-2 py-1 text-xs font-mono">
            <option value="t3.medium" {{if eq .Config.Waffaw.EC2InstanceType "t3.medium"}}selected{{end}}>t3.medium</option>
            <option value="t3.large" {{if eq .Config.Waffaw.EC2InstanceType "t3.large"}}selected{{end}}>t3.large</option>
            <option value="m5.large" {{if eq .Config.Waffaw.EC2InstanceType "m5.large"}}selected{{end}}>m5.large</option>
          </select>
          <div class="flex items-center gap-1.5 text-[10px] text-zinc-500" title="ENI count per EC2 (1 = single, 2+ = multi-ENI)">
            <input type="range" name="waffaw.ec2_eni_count" id="waf-eni-slider" min="1" max="4" value="{{if .Config.Waffaw.EC2MultiENI}}4{{else}}1{{end}}"
                   class="w-16 h-1 accent-green-500 cursor-pointer"
                   oninput="document.getElementById('waf-eni-val').textContent=this.value;document.getElementById('waf-eni-hidden').value=this.value>1?'on':''">
            <span id="waf-eni-val" class="font-mono text-zinc-400 w-3 text-center">{{if .Config.Waffaw.EC2MultiENI}}4{{else}}1{{end}}</span><span class="text-zinc-500">x IP</span>
            <input type="hidden" name="waffaw.ec2_multi_eni" id="waf-eni-hidden" value="{{if .Config.Waffaw.EC2MultiENI}}on{{end}}">
          </div>
        </div>
        <div class="flex items-center gap-2">
          <div class="bit-toggle" data-bits="5">
            <input type="hidden" name="waffaw.ec2_count" value="{{.Config.Waffaw.EC2Count}}">
          </div>
          <span class="text-[10px] text-zinc-500"><span id="waf-ec2-limit" class="text-zinc-600"></span></span>
        </div>
      </div>

      <!-- Fargate Column -->
      <div class="space-y-2">
        <input type="hidden" name="waffaw.ecs_use_spot" id="waf-ecs-spot-val" value="{{if .Config.Waffaw.ECSUseSpot}}on{{end}}">
        <div class="flex items-center gap-2">
          <div class="seg-group inline-flex rounded-md text-xs font-medium" data-target="waf-ecs-spot-val" data-on-value="on" data-off-value="">
            <button type="button" data-seg="on" class="seg-btn rounded-l-md px-3 py-1 border border-zinc-600">Fargate Spot</button>
            <button type="button" data-seg="" class="seg-btn rounded-r-md px-3 py-1 border border-l-0 border-zinc-600">Reserved</button>
          </div>
          <select name="waffaw.ecs_task_cpu" class="rounded-md border border-zinc-600 bg-zinc-900 px-2 py-1 text-xs font-mono">
            <option value="1024" {{if eq .Config.Waffaw.ECSTaskCPU 1024}}selected{{end}}>1 vCPU</option>
            <option value="2048" {{if eq .Config.Waffaw.ECSTaskCPU 2048}}selected{{end}}>2 vCPU</option>
          </select>
          <select name="waffaw.ecs_task_memory" class="rounded-md border border-zinc-600 bg-zinc-900 px-2 py-1 text-xs font-mono">
            <option value="2048" {{if eq .Config.Waffaw.ECSTaskMemory 2048}}selected{{end}}>2 GB</option>
            <option value="4096" {{if eq .Config.Waffaw.ECSTaskMemory 4096}}selected{{end}}>4 GB</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <div class="bit-toggle" data-bits="5">
            <input type="hidden" name="waffaw.ecs_desired_count" value="{{.Config.Waffaw.ECSDesiredCount}}">
          </div>
          <span class="text-[10px] text-zinc-500"><span id="waf-fargate-limit" class="text-zinc-600"></span></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Image URI + Build -->
  <div class="border-t border-zinc-200 dark:border-zinc-700 pt-3">
    <h4 class="text-xs uppercase tracking-wide text-green-500 mb-2">Container Image</h4>
    <div class="flex items-end gap-3">
      <div class="flex-1">
        <div class="flex items-center gap-2 mb-1">
          <label class="text-xs uppercase tracking-wide text-zinc-500 dark:text-zinc-400">Image URI</label>
          <span id="waffaw-ecr-badge" class="ecr-badge inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-zinc-100 dark:bg-zinc-700 text-zinc-500 dark:text-zinc-400" style="display:none"></span>
        </div>
        <input type="text" name="waffaw.image_uri" id="waffaw-image-uri" value="{{.Config.Waffaw.ImageURI}}"
               placeholder="{{.Config.Site.Label}}-waffaw:1.0.0"
               class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm font-mono">
      </div>
      <button type="button" onclick="checkWaffawImage()" id="waf-check-btn"
              class="rounded-md bg-zinc-600 hover:bg-zinc-500 text-white px-4 py-2 text-sm font-medium whitespace-nowrap"
              style="display: inline-flex; align-items: center; gap: 6px;">
        <svg style="width:14px;height:14px;flex-shrink:0;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        Check
      </button>
      <button type="button" onclick="buildWaffaw()" id="waf-build-btn"
              class="rounded-md bg-green-700 hover:bg-green-600 text-white px-4 py-2 text-sm font-medium whitespace-nowrap"
              style="display: inline-flex; align-items: center; gap: 6px;">
        <svg style="width:14px;height:14px;flex-shrink:0;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
        Build &amp; Push
      </button>
    </div>
  </div>

  <!-- Active Nodes Table -->
  <div class="border-t border-zinc-200 dark:border-zinc-700 pt-3">
    <div class="flex items-center justify-between mb-2">
      <h4 class="text-xs uppercase tracking-wide text-green-500">Active Nodes</h4>
      <div class="flex items-center gap-3">
        <button type="button" id="waf-purge-stale-btn" onclick="purgeStaleWAFNodes()" style="display:none"
                class="text-xs text-zinc-500 hover:text-red-400 transition-colors">Purge stale</button>
        <button type="button" onclick="document.getElementById('waf-fleet-table').dispatchEvent(new Event('refresh'))"
                class="text-xs text-zinc-400 hover:text-zinc-200">Refresh</button>
      </div>
    </div>
    <div id="waf-fleet-table"
         hx-get="/api/waf/fleet"
         hx-trigger="load, every 30s, refresh"
         hx-swap="innerHTML">
      <div class="text-xs text-zinc-500 py-4 text-center">Loading fleet status...</div>
    </div>
  </div>
</div>
{{end}}
