{{define "waffaw_fleet.html"}}
<div class="space-y-4">
  <!-- Fleet Configuration (Terraform Inputs) -->
  <div>
    <h4 class="text-xs uppercase tracking-wide text-green-500 mb-2">Fleet Configuration</h4>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

      <!-- EC2 Count -->
      <div>
        <label class="text-xs uppercase tracking-wide text-zinc-500 dark:text-zinc-400 mb-1 block">EC2 Bastion</label>
        <input type="number" name="waffaw.ec2_count" value="{{.Config.Waffaw.EC2Count}}" min="0" max="10"
               class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm">
        <p class="text-[10px] text-zinc-500 mt-1">0 = no EC2 (Fargate only)</p>
      </div>

      <!-- EC2 Instance Type -->
      <div>
        <label class="text-xs uppercase tracking-wide text-zinc-500 dark:text-zinc-400 mb-1 block">EC2 Instance Type</label>
        <select name="waffaw.ec2_instance_type"
                class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm">
          <option value="t3.medium" {{if eq .Config.Waffaw.EC2InstanceType "t3.medium"}}selected{{end}}>t3.medium (2 vCPU, 4 GiB)</option>
          <option value="t3.large" {{if eq .Config.Waffaw.EC2InstanceType "t3.large"}}selected{{end}}>t3.large (2 vCPU, 8 GiB)</option>
          <option value="m5.large" {{if eq .Config.Waffaw.EC2InstanceType "m5.large"}}selected{{end}}>m5.large (2 vCPU, 8 GiB)</option>
        </select>
      </div>

      <!-- ECS Desired Count -->
      <div>
        <label class="text-xs uppercase tracking-wide text-zinc-500 dark:text-zinc-400 mb-1 block">Fargate Tasks</label>
        <input type="number" name="waffaw.ecs_desired_count" value="{{.Config.Waffaw.ECSDesiredCount}}" min="0" max="20"
               class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm">
        <p class="text-[10px] text-zinc-500 mt-1">0 = stopped (no cost)</p>
      </div>

      <!-- ECS Task CPU -->
      <div>
        <label class="text-xs uppercase tracking-wide text-zinc-500 dark:text-zinc-400 mb-1 block">Task CPU</label>
        <select name="waffaw.ecs_task_cpu"
                class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm">
          <option value="1024" {{if eq .Config.Waffaw.ECSTaskCPU 1024}}selected{{end}}>1024 (1 vCPU)</option>
          <option value="2048" {{if eq .Config.Waffaw.ECSTaskCPU 2048}}selected{{end}}>2048 (2 vCPU)</option>
        </select>
      </div>
    </div>

    <!-- Toggle row -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-3">
      <div>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" name="waffaw.ec2_use_spot" class="toggle-switch" {{if .Config.Waffaw.EC2UseSpot}}checked{{end}}>
          <span class="text-sm">EC2 Spot Instances</span>
        </label>
        <p class="text-[10px] text-zinc-500 mt-1 ml-12">~85% cost savings</p>
      </div>
      <div>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" name="waffaw.ec2_multi_eni" class="toggle-switch" {{if .Config.Waffaw.EC2MultiENI}}checked{{end}}>
          <span class="text-sm">Multi-ENI (IP density)</span>
        </label>
        <p class="text-[10px] text-zinc-500 mt-1 ml-12">Up to 18 IPs per EC2</p>
      </div>
      <div>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" name="waffaw.ecs_use_spot" class="toggle-switch" {{if .Config.Waffaw.ECSUseSpot}}checked{{end}}>
          <span class="text-sm">Fargate Spot</span>
        </label>
        <p class="text-[10px] text-zinc-500 mt-1 ml-12">~70% cost savings</p>
      </div>
      <div>
        <label class="text-xs uppercase tracking-wide text-zinc-500 dark:text-zinc-400 mb-1 block">Task Memory</label>
        <select name="waffaw.ecs_task_memory"
                class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm">
          <option value="2048" {{if eq .Config.Waffaw.ECSTaskMemory 2048}}selected{{end}}>2048 MiB (2 GB)</option>
          <option value="4096" {{if eq .Config.Waffaw.ECSTaskMemory 4096}}selected{{end}}>4096 MiB (4 GB)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Image URI + Build -->
  <div class="border-t border-zinc-200 dark:border-zinc-700 pt-3">
    <h4 class="text-xs uppercase tracking-wide text-green-500 mb-2">Container Image</h4>
    <div class="flex items-end gap-3">
      <div class="flex-1">
        <label class="text-xs uppercase tracking-wide text-zinc-500 dark:text-zinc-400 mb-1 block">Image URI</label>
        <input type="text" name="waffaw.image_uri" id="waffaw-image-uri" value="{{.Config.Waffaw.ImageURI}}"
               placeholder="{{.Config.Site.Label}}-waffaw:1.0.0"
               class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm font-mono">
      </div>
      <button type="button" onclick="buildWaffaw()" id="waf-build-btn"
              class="rounded-md bg-zinc-700 hover:bg-zinc-600 text-white px-4 py-2 text-sm font-medium whitespace-nowrap"
              style="display: inline-flex; align-items: center; gap: 6px;">
        <svg style="width:14px;height:14px;flex-shrink:0;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
        Build &amp; Push
      </button>
    </div>
  </div>

  <!-- Active Nodes Table -->
  <div class="border-t border-zinc-200 dark:border-zinc-700 pt-3">
    <div class="flex items-center justify-between mb-2">
      <h4 class="text-xs uppercase tracking-wide text-green-500">Active Nodes</h4>
      <button type="button" onclick="document.getElementById('waf-fleet-table').dispatchEvent(new Event('refresh'))"
              class="text-xs text-zinc-400 hover:text-zinc-200">Refresh</button>
    </div>
    <div id="waf-fleet-table"
         hx-get="/api/waf/fleet"
         hx-trigger="load, every 30s, refresh"
         hx-swap="innerHTML">
      <div class="text-xs text-zinc-500 py-4 text-center">Loading fleet status...</div>
    </div>
  </div>
</div>
{{end}}
