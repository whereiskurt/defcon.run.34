{{define "ecr.html"}}
<div class="rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 shadow-sm overflow-hidden {{if not .Config.ECR.Enabled}}panel-disabled{{end}}" data-panel="ecr" data-module-num="12">
  <div class="flex justify-between items-center px-4 py-3 cursor-pointer hover:bg-zinc-50 dark:hover:bg-zinc-700/50" onclick="togglePanel('ecr')">
    <div class="flex items-center gap-3">
      <span class="drag-handle" title="Drag to reorder">⠿</span>
      <input type="checkbox" name="ecr.enabled" class="toggle-switch" {{if .Config.ECR.Enabled}}checked{{end}} onclick="event.stopPropagation(); toggleModule('ecr', this)">
      <h3 class="text-base font-semibold relative"><span class="module-num">#12</span>ECR</h3>
    </div>
    <svg class="w-4 h-4 chevron" id="chevron-ecr" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
  </div>
  <div class="panel-body border-t border-zinc-200 dark:border-zinc-700 px-4 py-3" id="body-ecr" style="display:none">
    <p class="text-xs text-zinc-400 mb-2">Repositories aggregated from services (read-only):</p>
    <ul class="text-sm space-y-1">
      <li class="font-mono text-xs text-zinc-500">run-auth-nginx, run-auth-app</li>
      <li class="font-mono text-xs text-zinc-500">run-human-nginx, run-human-app</li>
      <li class="font-mono text-xs text-zinc-500">run-cms-nginx, run-cms-app</li>
      <li class="font-mono text-xs text-zinc-500">run-gpx-app</li>
    </ul>
  </div>
</div>
{{end}}
