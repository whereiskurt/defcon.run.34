{{define "secrets.html"}}
<div class="rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 shadow-sm overflow-hidden {{if not .Config.Secrets.Enabled}}panel-disabled{{end}} mod-group-config" data-panel="secrets" data-module-num="5">
  <div class="flex justify-between items-center px-4 py-3 cursor-pointer hover:bg-zinc-50 dark:hover:bg-zinc-700/50" onclick="togglePanel('secrets')">
    <div class="flex items-center gap-3">
      <input type="checkbox" name="secrets.enabled" class="toggle-switch" {{if .Config.Secrets.Enabled}}checked{{end}} onclick="event.stopPropagation(); toggleModule('secrets', this)">
      <h3 class="text-base font-semibold relative"><span class="module-num">#05</span>SSM/Secrets</h3>
    </div>
    <svg class="w-4 h-4 chevron" id="chevron-secrets" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
  </div>
  <div class="panel-body border-t border-zinc-200 dark:border-zinc-700 px-4 py-3 space-y-3" id="body-secrets" style="display:none">
    <div class="flex items-center gap-3">
      <input type="checkbox" name="secrets.use_secrets_manager" class="toggle-switch" {{if .Config.Secrets.UseSecretsManager}}checked{{end}}>
      <label class="text-sm">Use Secrets Manager (instead of SSM Parameter Store)</label>
    </div>
    <div>
      <label class="text-xs uppercase tracking-wide text-zinc-500 dark:text-zinc-400 mb-1 block">Primary Region</label>
      <input type="text" name="secrets.primary_region" value="{{.Config.Secrets.PrimaryRegion}}" class="w-full rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-sm focus:ring-2 focus:ring-green-500">
    </div>
    <div>
      <label class="text-xs uppercase tracking-wide text-zinc-500 dark:text-zinc-400 mb-2 block">Secret Definitions</label>
      <div class="overflow-x-auto">
        <table class="w-full text-xs">
          <thead><tr class="text-zinc-400 border-b border-zinc-700"><th class="text-left py-1">Name</th><th class="text-left py-1">Description</th><th class="text-left py-1">Keys</th><th class="text-right py-1 w-16"></th></tr></thead>
          <tbody>
            {{range $name, $def := .Config.Secrets.Definitions}}
            <tr class="border-b border-zinc-700/50">
              <td class="py-1 font-mono">{{$name}}</td>
              <td class="py-1 text-zinc-400">{{$def.Description}}</td>
              <td class="py-1 font-mono text-zinc-500">{{join $def.Keys ", "}}</td>
              <td class="py-1 text-right">
                <button type="button" onclick="editSecret('{{$name}}')" class="sops-edit-btn text-xs px-2 py-0.5 rounded bg-zinc-700 hover:bg-zinc-600 text-zinc-300">Edit</button>
              </td>
            </tr>
            <tr id="sops-edit-{{$name}}" class="hidden">
              <td colspan="4" id="sops-edit-content-{{$name}}"></td>
            </tr>
            {{end}}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script>
function editSecret(name) {
  var row = document.getElementById('sops-edit-' + name);
  var content = document.getElementById('sops-edit-content-' + name);
  content.innerHTML = '<span class="text-xs text-zinc-400">Decrypting...</span>';
  row.classList.remove('hidden');
  fetch('/api/sops/edit', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'name='+encodeURIComponent(name)})
    .then(function(r){return r.text();}).then(function(html){content.innerHTML=html;});
}
function cancelEditSecret(name) {
  document.getElementById('sops-edit-' + name).classList.add('hidden');
}
function saveSecret(name) {
  var container = document.getElementById('sops-edit-content-' + name);
  var inputs = container.querySelectorAll('input[data-sops-key]');
  var body = 'name=' + encodeURIComponent(name);
  inputs.forEach(function(inp) {
    body += '&sops.' + encodeURIComponent(name) + '.' + encodeURIComponent(inp.dataset.sopsKey) + '=' + encodeURIComponent(inp.value);
  });
  container.innerHTML = '<span class="text-xs text-zinc-400">Encrypting...</span>';
  fetch('/api/sops/save', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:body})
    .then(function(r){return r.text();}).then(function(html){container.innerHTML=html;});
}
</script>
{{end}}
