{{define "status_editor.html"}}
<div class="rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 shadow-sm overflow-hidden mod-status-editor" data-panel="status_editor" data-module-num="A2">
  <div class="flex justify-between items-center px-4 py-3 cursor-pointer hover:bg-zinc-50 dark:hover:bg-zinc-700/50" onclick="togglePanel('status_editor')">
    <div class="flex items-center gap-3">
      <span class="drag-handle" title="Drag to reorder">⠿</span>
      <h3 class="text-base font-semibold relative"><span class="module-num">#A2</span>status.defcon.run</h3>
      <span class="text-xs text-zinc-400">Status site content (status.json)</span>
    </div>
    <svg class="w-4 h-4 chevron" id="chevron-status_editor" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
  </div>
  <div class="panel-body border-t border-zinc-200 dark:border-zinc-700 px-4 py-3 space-y-4" id="body-status_editor" style="display:none">

    <!-- Meta -->
    <div class="flex items-center gap-3 flex-wrap">
      <span class="text-xs text-zinc-400 font-mono">Poll (sec)</span>
      <input type="number" id="status-poll-seconds" value="{{.Status.PollSeconds}}" class="w-20 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
      <span class="text-[11px] text-zinc-500 font-mono ml-auto">updated: {{.Status.Updated}} <span class="text-zinc-600">(stamped at publish)</span></span>
    </div>

    <!-- Regions -->
    <div>
      <div class="flex items-center gap-2 mb-1">
        <h4 class="text-[10px] uppercase tracking-wide text-green-500">Regions</h4>
        <button type="button" onclick="statusAddRegion()" class="text-[11px] rounded border border-zinc-300 dark:border-zinc-600 px-1.5 py-0.5 text-zinc-500 hover:text-green-400 hover:border-green-500">+ region</button>
      </div>
      <div id="status-region-rows" class="space-y-1.5">
        {{range .Status.Regions}}
        <div class="status-region-row flex items-center gap-3">
          <input type="text" data-field="id" value="{{.ID}}" placeholder="id" class="w-24 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs font-mono focus:ring-1 focus:ring-green-500">
          <label class="flex items-center gap-1.5 text-xs"><input type="checkbox" data-field="deployed" class="toggle-switch" {{if .Deployed}}checked{{end}}> <span class="text-zinc-400">deployed</span></label>
          <button type="button" onclick="this.closest('.status-region-row').remove()" class="text-zinc-500 hover:text-red-400 text-xs" title="Remove">✕</button>
        </div>
        {{end}}
      </div>
    </div>

    <!-- Services -->
    <div>
      <div class="flex items-center gap-2 mb-1">
        <h4 class="text-[10px] uppercase tracking-wide text-green-500">Services</h4>
        <button type="button" onclick="statusAddService()" class="text-[11px] rounded border border-zinc-300 dark:border-zinc-600 px-1.5 py-0.5 text-zinc-500 hover:text-green-400 hover:border-green-500">+ service</button>
      </div>
      <div id="status-svc-rows" class="space-y-2">
        {{range .Status.Services}}
        <div class="status-svc-row rounded-md border border-zinc-200 dark:border-zinc-700 p-2 grid grid-cols-[repeat(3,minmax(0,1fr))_auto] gap-1.5 items-center">
          <input type="text" data-field="id" value="{{.ID}}" placeholder="id" class="rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs font-mono focus:ring-1 focus:ring-green-500">
          <input type="text" data-field="name" value="{{.Name}}" placeholder="name" class="rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs font-mono focus:ring-1 focus:ring-green-500">
          <input type="text" data-field="version" value="{{.Version}}" placeholder="version" class="rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs font-mono focus:ring-1 focus:ring-green-500">
          <button type="button" onclick="this.closest('.status-svc-row').remove()" class="text-zinc-500 hover:text-red-400 text-xs row-span-2 justify-self-center" title="Remove service">✕</button>
          <input type="text" data-field="host" value="{{.Host}}" placeholder="host" class="rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs font-mono focus:ring-1 focus:ring-green-500">
          <input type="text" data-field="link" value="{{.Link}}" placeholder="link (optional)" class="rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs font-mono focus:ring-1 focus:ring-green-500">
          <select data-field="state" class="rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs focus:ring-1 focus:ring-green-500">
            <option value="live" {{if eq .State "live"}}selected{{end}}>live</option>
            <option value="dev" {{if eq .State "dev"}}selected{{end}}>dev</option>
            <option value="down" {{if eq .State "down"}}selected{{end}}>down</option>
          </select>
          <input type="text" data-field="note" value="{{.Note}}" placeholder="note" class="col-span-3 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs focus:ring-1 focus:ring-green-500">
        </div>
        {{end}}
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-2 flex-wrap pt-1 border-t border-zinc-200 dark:border-zinc-700">
      <button type="button" onclick="statusSave()" class="rounded-md bg-green-700 hover:bg-green-600 text-white px-4 py-2 text-sm font-medium">Save status.json</button>
      <button type="button" onclick="statusPublish()" class="rounded-md bg-red-700 hover:bg-red-600 text-white px-4 py-2 text-sm font-semibold ml-auto" style="display:inline-flex;align-items:center;gap:6px;" title="Uploads status.json to S3 and invalidates CloudFront — real deploy">
        <svg style="width:14px;height:14px;flex-shrink:0;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
        <span>Publish (S3 + CloudFront)</span>
      </button>
    </div>
  </div>
</div>

<script>
function statusServiceRowHTML() {
  return '<div class="status-svc-row rounded-md border border-zinc-200 dark:border-zinc-700 p-2 grid grid-cols-[repeat(3,minmax(0,1fr))_auto] gap-1.5 items-center">' +
    '<input type="text" data-field="id" placeholder="id" class="rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs font-mono focus:ring-1 focus:ring-green-500">' +
    '<input type="text" data-field="name" placeholder="name" class="rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs font-mono focus:ring-1 focus:ring-green-500">' +
    '<input type="text" data-field="version" placeholder="version" class="rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs font-mono focus:ring-1 focus:ring-green-500">' +
    '<button type="button" onclick="this.closest(\'.status-svc-row\').remove()" class="text-zinc-500 hover:text-red-400 text-xs row-span-2 justify-self-center" title="Remove service">✕</button>' +
    '<input type="text" data-field="host" placeholder="host" class="rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs font-mono focus:ring-1 focus:ring-green-500">' +
    '<input type="text" data-field="link" placeholder="link (optional)" class="rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs font-mono focus:ring-1 focus:ring-green-500">' +
    '<select data-field="state" class="rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs focus:ring-1 focus:ring-green-500"><option value="live">live</option><option value="dev" selected>dev</option><option value="down">down</option></select>' +
    '<input type="text" data-field="note" placeholder="note" class="col-span-3 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs focus:ring-1 focus:ring-green-500">' +
    '</div>';
}

function statusRegionRowHTML() {
  return '<div class="status-region-row flex items-center gap-3">' +
    '<input type="text" data-field="id" placeholder="id" class="w-24 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs font-mono focus:ring-1 focus:ring-green-500">' +
    '<label class="flex items-center gap-1.5 text-xs"><input type="checkbox" data-field="deployed" class="toggle-switch"> <span class="text-zinc-400">deployed</span></label>' +
    '<button type="button" onclick="this.closest(\'.status-region-row\').remove()" class="text-zinc-500 hover:text-red-400 text-xs" title="Remove">✕</button>' +
    '</div>';
}

function statusAddService() {
  document.getElementById('status-svc-rows').insertAdjacentHTML('beforeend', statusServiceRowHTML());
}

function statusAddRegion() {
  document.getElementById('status-region-rows').insertAdjacentHTML('beforeend', statusRegionRowHTML());
}

function statusCollect() {
  var services = [];
  document.querySelectorAll('#status-svc-rows .status-svc-row').forEach(function(row) {
    var g = function(f) { var el = row.querySelector('[data-field="' + f + '"]'); return el ? el.value.trim() : ''; };
    var id = g('id');
    if (!id) return; // skip blank rows
    var svc = { id: id, name: g('name'), host: g('host'), version: g('version'), state: g('state'), note: g('note') };
    var link = g('link');
    if (link) svc.link = link;
    services.push(svc);
  });
  var regions = [];
  document.querySelectorAll('#status-region-rows .status-region-row').forEach(function(row) {
    var idEl = row.querySelector('[data-field="id"]');
    var depEl = row.querySelector('[data-field="deployed"]');
    var id = idEl ? idEl.value.trim() : '';
    if (!id) return;
    regions.push({ id: id, deployed: depEl ? depEl.checked : false });
  });
  var pollEl = document.getElementById('status-poll-seconds');
  var poll = parseInt(pollEl.value, 10);
  if (isNaN(poll)) poll = 0;
  return { poll_seconds: poll, regions: regions, services: services };
}

function statusSave() {
  var payload = statusCollect();
  fetch('/api/status/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function(resp) {
    return resp.text().then(function(t) { return { ok: resp.ok, body: t }; });
  }).then(function(r) {
    if (r.ok) {
      showToast('status.json saved (' + payload.services.length + ' services)', 3000);
    } else {
      showToast('Save failed: ' + r.body, 6000);
    }
  }).catch(function(e) {
    showToast('Save error: ' + e.message, 6000);
  });
}

function statusPublish() {
  showConfirmDialog({
    title: 'Publish status site?',
    message: 'This uploads status.json + marquee.json to S3 and invalidates CloudFront (real deploy of status.defcon.run). Save your edits first — Publish does not save.',
    confirmLabel: 'Publish',
    confirmClass: 'bg-red-600 hover:bg-red-500 text-white',
    onConfirm: function() { openTerminal('status_publish', 'publish', ''); }
  });
}
</script>
{{end}}
