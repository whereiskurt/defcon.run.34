{{define "svc_cms.html"}}
<div class="rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 shadow-sm overflow-hidden mod-svc-cms" data-panel="svc_cms" data-module-num="S3">
  <div class="flex justify-between items-center px-4 py-3 cursor-pointer hover:bg-zinc-50 dark:hover:bg-zinc-700/50" onclick="togglePanel('svc_cms')">
    <div class="flex items-center gap-3">
      <span class="drag-handle" title="Drag to reorder">⠿</span>
      <h3 class="text-base font-semibold relative"><span class="module-num">S3</span>run.cms</h3>
      <span class="text-xs text-zinc-400">Strapi CMS (master + worker)</span>
    </div>
    <svg class="w-4 h-4 chevron" id="chevron-svc_cms" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
  </div>
  <div class="panel-body border-t border-zinc-200 dark:border-zinc-700 px-4 py-3 space-y-3" id="body-svc_cms" style="display:none">
    <!-- Master Task -->
    <div>
      <h4 class="text-[10px] uppercase tracking-wide text-green-500 mb-1">Master Task <span class="text-zinc-500">(us-east-1)</span></h4>
      <div class="flex items-center gap-3">
        <span class="text-xs text-zinc-400 font-mono w-12">CPU</span>
        <input type="number" name="svc.cms.master.task_cpu" value="{{.Config.Services.CMS.MasterTask.TaskCPU}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <span class="text-xs text-zinc-400 font-mono w-12">Memory</span>
        <input type="number" name="svc.cms.master.task_memory" value="{{.Config.Services.CMS.MasterTask.TaskMemory}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
      </div>
    </div>
    <!-- Master Containers -->
    <div>
      <h4 class="text-[10px] uppercase tracking-wide text-zinc-500 mb-1">Master Containers</h4>
      <div class="grid grid-cols-[auto_1fr_1fr_1fr] gap-x-3 gap-y-1.5 items-center">
        <span class="text-[10px] text-zinc-500"></span>
        <span class="text-[10px] text-zinc-500 text-center">CPU</span>
        <span class="text-[10px] text-zinc-500 text-center">Mem</span>
        <span class="text-[10px] text-zinc-500 text-center">Reserve</span>
        <span class="text-xs text-zinc-400 font-mono">nginx</span>
        <input type="number" name="svc.cms.master.nginx.cpu" value="{{.Config.Services.CMS.MasterNginx.CPU}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <input type="number" name="svc.cms.master.nginx.memory" value="{{.Config.Services.CMS.MasterNginx.Memory}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <span class="w-16"></span>
        <span class="text-xs text-zinc-400 font-mono">app</span>
        <input type="number" name="svc.cms.master.app.cpu" value="{{.Config.Services.CMS.MasterApp.CPU}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <input type="number" name="svc.cms.master.app.memory" value="{{.Config.Services.CMS.MasterApp.Memory}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <input type="number" name="svc.cms.master.app.mem_reservation" value="{{.Config.Services.CMS.MasterApp.MemoryReservation}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
      </div>
    </div>
    <!-- Master Service -->
    <div>
      <div class="flex items-center gap-3">
        <span class="text-xs text-zinc-400 font-mono">Master Count</span>
        <input type="number" name="svc.cms.master.desired_count" value="{{.Config.Services.CMS.MasterService.DesiredCount}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
      </div>
    </div>
    <!-- Worker -->
    <div class="border-t border-zinc-200 dark:border-zinc-700 pt-3">
      <h4 class="text-[10px] uppercase tracking-wide text-green-500 mb-1">Worker Task <span class="text-zinc-500">(all regions)</span></h4>
      <div class="flex items-center gap-3">
        <span class="text-xs text-zinc-400 font-mono w-12">CPU</span>
        <input type="number" name="svc.cms.worker.task_cpu" value="{{.Config.Services.CMS.WorkerTask.TaskCPU}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <span class="text-xs text-zinc-400 font-mono w-12">Memory</span>
        <input type="number" name="svc.cms.worker.task_memory" value="{{.Config.Services.CMS.WorkerTask.TaskMemory}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
      </div>
    </div>
    <!-- Worker Containers -->
    <div>
      <h4 class="text-[10px] uppercase tracking-wide text-zinc-500 mb-1">Worker Containers</h4>
      <div class="grid grid-cols-[auto_1fr_1fr_1fr] gap-x-3 gap-y-1.5 items-center">
        <span class="text-[10px] text-zinc-500"></span>
        <span class="text-[10px] text-zinc-500 text-center">CPU</span>
        <span class="text-[10px] text-zinc-500 text-center">Mem</span>
        <span class="text-[10px] text-zinc-500 text-center">Reserve</span>
        <span class="text-xs text-zinc-400 font-mono">nginx</span>
        <input type="number" name="svc.cms.worker.nginx.cpu" value="{{.Config.Services.CMS.WorkerNginx.CPU}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <input type="number" name="svc.cms.worker.nginx.memory" value="{{.Config.Services.CMS.WorkerNginx.Memory}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <span class="w-16"></span>
        <span class="text-xs text-zinc-400 font-mono">app</span>
        <input type="number" name="svc.cms.worker.app.cpu" value="{{.Config.Services.CMS.WorkerApp.CPU}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <input type="number" name="svc.cms.worker.app.memory" value="{{.Config.Services.CMS.WorkerApp.Memory}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <input type="number" name="svc.cms.worker.app.mem_reservation" value="{{.Config.Services.CMS.WorkerApp.MemoryReservation}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
      </div>
    </div>
    <!-- Worker Service -->
    <div>
      <h4 class="text-[10px] uppercase tracking-wide text-green-500 mb-1">Worker Service</h4>
      <div class="flex items-center gap-3 flex-wrap">
        <span class="text-xs text-zinc-400 font-mono">Count</span>
        <input type="number" name="svc.cms.worker.desired_count" value="{{.Config.Services.CMS.WorkerService.DesiredCount}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <label class="flex items-center gap-1.5 text-xs"><input type="checkbox" name="svc.cms.worker.autoscaling.enabled" class="toggle-switch" {{if .Config.Services.CMS.WorkerService.Autoscaling.Enabled}}checked{{end}}> <span class="text-zinc-400">Autoscale</span></label>
        <span class="text-xs text-zinc-400 font-mono">Min</span>
        <input type="number" name="svc.cms.worker.autoscaling.min" value="{{.Config.Services.CMS.WorkerService.Autoscaling.MinCapacity}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <span class="text-xs text-zinc-400 font-mono">Max</span>
        <input type="number" name="svc.cms.worker.autoscaling.max" value="{{.Config.Services.CMS.WorkerService.Autoscaling.MaxCapacity}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
      </div>
    </div>
  </div>
</div>
{{end}}
