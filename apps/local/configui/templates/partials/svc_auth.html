{{define "svc_auth.html"}}
<div class="rounded-lg border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 shadow-sm overflow-hidden mod-svc-auth" data-panel="svc_auth" data-module-num="S1">
  <div class="flex justify-between items-center px-4 py-3 cursor-pointer hover:bg-zinc-50 dark:hover:bg-zinc-700/50" onclick="togglePanel('svc_auth')">
    <div class="flex items-center gap-3">
      <span class="drag-handle" title="Drag to reorder">⠿</span>
      <h3 class="text-base font-semibold relative"><span class="module-num">S1</span>run.auth</h3>
      <span class="text-xs text-zinc-400">Auth + OIDC provider</span>
    </div>
    <svg class="w-4 h-4 chevron" id="chevron-svc_auth" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
  </div>
  <div class="panel-body border-t border-zinc-200 dark:border-zinc-700 px-4 py-3 space-y-3" id="body-svc_auth" style="display:none">
    <!-- Task -->
    <div>
      <h4 class="text-[10px] uppercase tracking-wide text-green-500 mb-1">Task</h4>
      <div class="flex items-center gap-3">
        <span class="text-xs text-zinc-400 font-mono w-12">CPU</span>
        <input type="number" name="svc.auth.task_cpu" value="{{.Config.Services.Auth.Task.TaskCPU}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <span class="text-xs text-zinc-400 font-mono w-12">Memory</span>
        <input type="number" name="svc.auth.task_memory" value="{{.Config.Services.Auth.Task.TaskMemory}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
      </div>
    </div>
    <!-- Containers -->
    <div>
      <h4 class="text-[10px] uppercase tracking-wide text-green-500 mb-1">Containers</h4>
      <div class="grid grid-cols-[auto_1fr_1fr_1fr] gap-x-3 gap-y-1.5 items-center">
        <span class="text-[10px] text-zinc-500"></span>
        <span class="text-[10px] text-zinc-500 text-center">CPU</span>
        <span class="text-[10px] text-zinc-500 text-center">Mem</span>
        <span class="text-[10px] text-zinc-500 text-center">Reserve</span>
        <span class="text-xs text-zinc-400 font-mono">nginx</span>
        <input type="number" name="svc.auth.nginx.cpu" value="{{.Config.Services.Auth.Nginx.CPU}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <input type="number" name="svc.auth.nginx.memory" value="{{.Config.Services.Auth.Nginx.Memory}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <input type="number" name="svc.auth.nginx.mem_reservation" value="{{.Config.Services.Auth.Nginx.MemoryReservation}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <span class="text-xs text-zinc-400 font-mono">app</span>
        <input type="number" name="svc.auth.app.cpu" value="{{.Config.Services.Auth.App.CPU}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <input type="number" name="svc.auth.app.memory" value="{{.Config.Services.Auth.App.Memory}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <input type="number" name="svc.auth.app.mem_reservation" value="{{.Config.Services.Auth.App.MemoryReservation}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
      </div>
    </div>
    <!-- Service -->
    <div>
      <h4 class="text-[10px] uppercase tracking-wide text-green-500 mb-1">Service</h4>
      <div class="flex items-center gap-3 flex-wrap">
        <span class="text-xs text-zinc-400 font-mono">Count</span>
        <input type="number" name="svc.auth.desired_count" value="{{.Config.Services.Auth.Service.DesiredCount}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <label class="flex items-center gap-1.5 text-xs"><input type="checkbox" name="svc.auth.autoscaling.enabled" class="toggle-switch" {{if .Config.Services.Auth.Service.Autoscaling.Enabled}}checked{{end}}> <span class="text-zinc-400">Autoscale</span></label>
        <span class="text-xs text-zinc-400 font-mono">Min</span>
        <input type="number" name="svc.auth.autoscaling.min" value="{{.Config.Services.Auth.Service.Autoscaling.MinCapacity}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
        <span class="text-xs text-zinc-400 font-mono">Max</span>
        <input type="number" name="svc.auth.autoscaling.max" value="{{.Config.Services.Auth.Service.Autoscaling.MaxCapacity}}" class="w-16 rounded-md border border-zinc-300 dark:border-zinc-600 bg-zinc-50 dark:bg-zinc-900 px-1.5 py-1 text-xs text-center focus:ring-1 focus:ring-green-500">
      </div>
    </div>
  </div>
</div>
{{end}}
