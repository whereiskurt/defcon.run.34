{{define "waffaw_intel.html"}}
<div class="space-y-4">
  <!-- Controls -->
  <div class="flex items-center gap-3">
    <button type="button" onclick="runWAFIntel()" id="waf-intel-btn"
            class="rounded-md bg-green-700 hover:bg-green-600 text-white px-4 py-2 text-sm font-medium"
            style="display: inline-flex; align-items: center; gap: 6px;">
      <svg style="width:14px;height:14px;flex-shrink:0;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      Run Analysis
    </button>
    <span id="waf-intel-timestamp" class="text-xs text-zinc-500"></span>
    <div class="ml-auto">
      <button type="button" onclick="confirmIntelReset()" id="waf-intel-reset-btn"
              class="rounded-md border border-red-700 text-red-400 hover:bg-red-900/30 px-3 py-1.5 text-xs font-mono"
              title="Delete all S3 log data and Athena partitions for a fresh start">
        Reset Data
      </button>
    </div>
  </div>

  <!-- Dashboard Container -->
  <div id="waf-intel-dashboard">
    <div class="text-xs text-zinc-500 py-8 text-center">Click "Run Analysis" to query Athena for campaign analytics.</div>
  </div>
</div>
{{end}}
